name: build-image

on:
  push:
    branches:
      - main
    paths:
      - frontend/**
      - .forgejo/workflows/build-image.yml
  pull_request:
    paths:
      - frontend/**
      - .forgejo/workflows/build-image.yml
  workflow_dispatch:

enable-openid-connect: true

jobs:
  build-and-push:
    runs-on: docker
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Fetch registry JWT
        id: jwt
        env:
          AUD: ${{ secrets.ACTIONS_PACKAGE_PUBLISH_CLAIM }}
        run: |
          jwt=$( \
            curl --fail \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=$AUD" \
            | jq -r ".value" \
          )
          echo "::add-mask::$jwt"
          echo "jwt=$jwt" >> "$FORGEJO_OUTPUT"

      - name: Log in to registry
        uses: docker/login-action@v3
        with:
          registry: git.jellydonut.ws
          username: ${{ github.actor }}
          password: ${{ steps.jwt.outputs.jwt }}

      - name: Set image tags
        id: tags
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            tags="git.jellydonut.ws/raku/rakuspace:pr-${{ github.event.pull_request.number }}"
          elif [ "${{ github.ref }}" = "refs/heads/main" ]; then
            tags="git.jellydonut.ws/raku/rakuspace:latest
          git.jellydonut.ws/raku/rakuspace:${{ github.sha }}"
          else
            branch=$(echo "${{ github.ref_name }}" | tr -c 'a-zA-Z0-9' '-')
            tags="git.jellydonut.ws/raku/rakuspace:branch-$branch"
          fi
          {
            echo "tags<<EOF"
            echo "$tags"
            echo "EOF"
          } >> "$FORGEJO_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: frontend
          file: frontend/Containerfile
          push: true
          tags: ${{ steps.tags.outputs.tags }}
