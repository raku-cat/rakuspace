name: build-image

on:
  push:
    branches:
      - main
    paths:
      - frontend/**
      - .forgejo/workflows/build-image.yml
  workflow_dispatch:

enable-openid-connect: true

jobs:
  build-and-push:
    runs-on: docker
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Fetch registry JWT
        id: jwt
        env:
          AUD: u:2:c0489812-2523-4791-876a-e7a5ab7d3d19
        run: |
          jwt=$( \
            curl --fail \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=$AUD" \
            | jq -r ".value" \
          )
          echo "::add-mask::$jwt"
          echo "jwt=$jwt" >> "$FORGEJO_OUTPUT"

      - name: Log in to registry
        uses: docker/login-action@v3
        with:
          registry: git.jellydonut.ws
          username: ${{ github.actor }}
          password: ${{ steps.jwt.outputs.jwt }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: frontend
          push: true
          tags: |
            git.jellydonut.ws/raku/rakuspace:latest
            git.jellydonut.ws/raku/rakuspace:${{ github.sha }}
