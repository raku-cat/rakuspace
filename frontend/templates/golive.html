<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Go Live - RakuSpace</title>
  <link rel="icon" href="{{ url_for('static', filename='logo.png') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='app.css') }}">
  <style>
    body { display: flex; flex-direction: column; }
    header { justify-content: space-between; }

    main { flex: 1; display: flex; align-items: center; justify-content: center; padding: 24px; }

    .card { width: 480px; margin-bottom: 0; text-align: center; }
    .card h1 { font-size: 1.1em; margin: 0 0 18px 0; }

    #preview-wrap {
      display: none;
      margin-bottom: 18px;
      background: #000;
      border: 1px solid var(--ctp-surface1);
      border-radius: 6px;
      overflow: hidden;
    }
    #preview {
      display: block;
      width: 100%;
      max-height: 320px;
      background: #000;
    }

    #cast-btn {
      width: 100%;
      padding: 12px;
      font-size: 1em;
    }

    #status { font-size: 0.85em; height: 1.2em; margin-top: 10px; color: var(--ctp-subtext0); }
    #status.error { color: var(--ctp-red); }
    #status.live { color: var(--ctp-green); }

    #unconfigured-note {
      display: none;
      font-size: 0.85em;
      color: var(--ctp-overlay1);
      margin-top: 10px;
    }
  </style>
</head>
<body>

  <header>
    <div class="header-left">
      <a class="brand" href="{{ url_for('index') }}">
        <img src="{{ url_for('static', filename='logo.png') }}" alt="">
        <span class="brand-name">RakuSpace</span>
      </a>
      <span class="page-title">Go Live!</span>
    </div>
    <a class="login-btn" href="{{ url_for('index') }}">&larr; Back to Home</a>
  </header>

  <main>
    <div class="card">
      <h1>Screenshare control</h1>

      <div id="preview-wrap">
        <video id="preview" autoplay muted playsinline></video>
      </div>

      <button id="cast-btn" class="btn-primary" type="button">Start casting</button>
      <div id="status"></div>
      <div id="unconfigured-note">
        Screenshare publishing isn't configured on this server yet.
      </div>
    </div>
  </main>

  <script>
    const whipUrl = {{ whip_url | tojson }};
    const STUN_SERVER = "stun:stun.ovenmediaengine.com:13478";

    const castBtn = document.getElementById("cast-btn");
    const status = document.getElementById("status");
    const previewWrap = document.getElementById("preview-wrap");
    const preview = document.getElementById("preview");
    const unconfiguredNote = document.getElementById("unconfigured-note");

    let mediaStream = null;
    let pc = null;
    let whipResourceUrl = null;
    let live = false;

    // Encode-cost ladder for the screenshare's video codec, most preferred
    // first. H264 favors hardware encoders on most browsers/OSes (cheaper
    // than VP8's software encode) and matches what our OBS/RTMP users already
    // stream in; VP8 is the universally-supported fallback. Video isn't
    // transcoded server-side (OutputProfile is Bypass), so whichever codec
    // wins here is what every viewer's browser has to decode.
    const CODEC_PRIORITY = ["video/h264", "video/vp8"];

    let reconnectTimer = null;
    let reconnectAttempt = 0;
    let disconnectGraceTimer = null;
    const RECONNECT_BASE_DELAY_MS = 2000;
    const RECONNECT_MAX_DELAY_MS = 10000;
    const DISCONNECT_GRACE_MS = 5000;

    function setStatus(text, cls) {
      status.textContent = text || "";
      status.className = cls || "";
    }

    if (!whipUrl) {
      castBtn.disabled = true;
      unconfiguredNote.style.display = "";
    }

    async function startCasting() {
      castBtn.disabled = true;
      setStatus("Requesting screen…");
      try {
        mediaStream = await navigator.mediaDevices.getDisplayMedia({ video: true, audio: true });
      } catch (err) {
        setStatus("Screen share cancelled or denied.", "error");
        castBtn.disabled = false;
        return;
      }

      preview.srcObject = mediaStream;
      previewWrap.style.display = "";
      mediaStream.getTracks().forEach(track => {
        track.addEventListener("ended", () => { if (live) stopCasting(); });
      });

      setStatus("Connecting to stream server…");
      try {
        await connectWhip();
        live = true;
        castBtn.textContent = "Stop stream";
        castBtn.classList.remove("btn-primary");
        castBtn.classList.add("btn-danger");
        setStatus("Live!", "live");
      } catch (err) {
        setStatus("Failed to start stream: " + err.message, "error");
        teardown();
      } finally {
        castBtn.disabled = false;
      }
    }

    // Does the actual WHIP offer/answer exchange against the existing
    // mediaStream tracks. Used both for the initial publish and for each
    // reconnect attempt after the connection drops.
    async function connectWhip() {
      pc = new RTCPeerConnection({ iceServers: [{ urls: STUN_SERVER }] });
      pc.onconnectionstatechange = handleConnectionStateChange;
      mediaStream.getTracks().forEach(track => pc.addTrack(track, mediaStream));
      applyCodecPreferences(pc);

      const offer = await pc.createOffer();
      await pc.setLocalDescription(offer);
      await waitForIceGathering(pc);

      const res = await fetch(whipUrl, {
        method: "POST",
        headers: { "Content-Type": "application/sdp" },
        body: pc.localDescription.sdp,
      });
      if (!res.ok) throw new Error(describePublishError(res.status));

      const answerSdp = await res.text();
      await pc.setRemoteDescription({ type: "answer", sdp: answerSdp });

      const location = res.headers.get("Location");
      whipResourceUrl = location ? new URL(location, whipUrl).toString() : null;
    }

    // Reorders (never drops) the browser's available video codecs so the
    // cheapest-to-encode option we actually support wins the WHIP offer
    // negotiation, falling back automatically if a browser lacks it.
    function applyCodecPreferences(peerConnection) {
      if (typeof RTCRtpSender === "undefined" || !RTCRtpSender.getCapabilities) return;
      const transceiver = peerConnection.getTransceivers().find(
        t => t.sender && t.sender.track && t.sender.track.kind === "video"
      );
      if (!transceiver || typeof transceiver.setCodecPreferences !== "function") return;

      const capabilities = RTCRtpSender.getCapabilities("video");
      if (!capabilities) return;

      const rank = codec => {
        const i = CODEC_PRIORITY.indexOf(codec.mimeType.toLowerCase());
        return i === -1 ? CODEC_PRIORITY.length : i;
      };
      const ordered = [...capabilities.codecs].sort((a, b) => rank(a) - rank(b));
      transceiver.setCodecPreferences(ordered);
    }

    // WebRTC's own disconnect handling is what gives WHIP a much clunkier
    // reconnect story than RTMP: OBS notices a dropped socket and redials
    // itself almost instantly, but a browser RTCPeerConnection just sits in
    // "disconnected"/"failed" forever unless something actively rebuilds it.
    // Reuses the existing mediaStream (no re-prompting for screen share) and
    // redoes the WHIP offer/answer with backoff until it succeeds or the
    // user stops casting.
    function handleConnectionStateChange() {
      if (!pc) return;
      const state = pc.connectionState;
      if (state === "failed") {
        clearDisconnectGrace();
        scheduleReconnect();
      } else if (state === "disconnected") {
        if (!disconnectGraceTimer) {
          disconnectGraceTimer = setTimeout(() => {
            disconnectGraceTimer = null;
            if (pc && pc.connectionState === "disconnected") scheduleReconnect();
          }, DISCONNECT_GRACE_MS);
        }
      } else {
        clearDisconnectGrace();
      }
    }

    function clearDisconnectGrace() {
      if (disconnectGraceTimer) { clearTimeout(disconnectGraceTimer); disconnectGraceTimer = null; }
    }

    function scheduleReconnect() {
      if (!live || reconnectTimer) return;
      if (pc) { pc.onconnectionstatechange = null; pc.close(); pc = null; }
      whipResourceUrl = null;
      reconnectAttempt += 1;
      const delay = Math.min(RECONNECT_BASE_DELAY_MS * reconnectAttempt, RECONNECT_MAX_DELAY_MS);
      setStatus("Connection lost, reconnecting…", "error");
      reconnectTimer = setTimeout(async () => {
        reconnectTimer = null;
        try {
          await connectWhip();
          reconnectAttempt = 0;
          setStatus("Live!", "live");
        } catch (err) {
          scheduleReconnect();
        }
      }, delay);
    }

    // WHIP publish rejections are mostly deterministic HTTP status codes --
    // map the common ones to plain-language reasons instead of surfacing the
    // bare status to the streamer.
    function describePublishError(status) {
      switch (status) {
        case 401:
        case 403:
          return "Not authorized to publish (check the server's stream config).";
        case 404:
          return "Stream endpoint not found on the server.";
        case 409:
          return "There's already a stream going.";
        case 415:
          return "Server didn't accept the stream format.";
        default:
          if (status >= 500) return "Streaming server error, try again shortly.";
          return `Server rejected publish (${status}).`;
      }
    }

    function waitForIceGathering(peerConnection) {
      if (peerConnection.iceGatheringState === "complete") return Promise.resolve();
      return new Promise(resolve => {
        function check() {
          if (peerConnection.iceGatheringState === "complete") {
            peerConnection.removeEventListener("icegatheringstatechange", check);
            resolve();
          }
        }
        peerConnection.addEventListener("icegatheringstatechange", check);
        // Don't hang forever waiting for every candidate.
        setTimeout(resolve, 3000);
      });
    }

    async function stopCasting() {
      castBtn.disabled = true;
      if (reconnectTimer) { clearTimeout(reconnectTimer); reconnectTimer = null; }
      clearDisconnectGrace();
      reconnectAttempt = 0;
      if (whipResourceUrl) {
        try { await fetch(whipResourceUrl, { method: "DELETE" }); } catch (err) { /* best-effort */ }
      }
      teardown();
      setStatus("");
      castBtn.disabled = false;
    }

    function teardown() {
      live = false;
      if (pc) { pc.onconnectionstatechange = null; pc.close(); pc = null; }
      if (mediaStream) { mediaStream.getTracks().forEach(track => track.stop()); mediaStream = null; }
      whipResourceUrl = null;
      preview.srcObject = null;
      previewWrap.style.display = "none";
      castBtn.textContent = "Start casting";
      castBtn.classList.remove("btn-danger");
      castBtn.classList.add("btn-primary");
    }

    castBtn.addEventListener("click", () => {
      if (live) {
        stopCasting();
      } else {
        startCasting();
      }
    });
  </script>
</body>
</html>
