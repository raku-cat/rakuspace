<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Go Live - RakuSpace</title>
  <link rel="icon" href="{{ url_for('static', filename='logo.png') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='app.css') }}">
  <style>
    #preview { display: none; width: 100%; height: 100%; object-fit: contain; background: #000; }
    #preview.active { display: block; }

    /* ---- Retro window (early-2000s comms-client chrome), scoped to .retro-win ---- */
    .retro-win {
      --win-face: #151a21;
      --win-face-raised: #212932;
      --win-face-light: #7c8b99;
      --win-edge-bright: #b9d4e0;
      --win-face-dark: #05070a;
      --win-face-darker: #000;
      --win-title-start: #1b2b36;
      --win-title-end: #0a1015;
      --win-title-text: #9fe8fb;
      --win-accent: #6fd7e8;
      --win-inset-bg: #000;
      --win-field-bg: #05070a;
      --win-text: #dfe8ee;
      --win-text-dim: #8ea4b2;
      color-scheme: dark;
      width: 100%;
      max-width: 660px;
      margin: 0 auto;
      background: var(--win-face);
      color: var(--win-text);
      font-family: "Tahoma", "MS Sans Serif", "Segoe UI", sans-serif;
      font-size: 12px;
      border: 3px solid var(--win-face-raised);
      border-top-color: var(--win-edge-bright);
      border-left-color: var(--win-face-light);
      border-right-color: var(--win-face-darker);
      border-bottom-color: var(--win-face-darker);
      box-shadow: 0 0 0 1px rgba(111, 215, 232, 0.25), 8px 8px 0 rgba(0, 0, 0, 0.55);
    }

    .retro-win .bevel-out {
      border-top: 1px solid var(--win-face-light);
      border-left: 1px solid var(--win-face-light);
      border-right: 1px solid var(--win-face-darker);
      border-bottom: 1px solid var(--win-face-darker);
      box-shadow: inset 1px 1px 0 var(--win-edge-bright), inset -1px -1px 0 var(--win-face-darker);
    }
    .retro-win .bevel-in {
      border-top: 1px solid var(--win-face-darker);
      border-left: 1px solid var(--win-face-darker);
      border-right: 1px solid var(--win-face-light);
      border-bottom: 1px solid var(--win-face-light);
      box-shadow: inset 1px 1px 0 var(--win-face-darker), inset -1px -1px 0 var(--win-edge-bright);
    }

    .retro-win .retro-titlebar {
      height: 22px;
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 0 6px;
      background: linear-gradient(180deg, var(--win-title-start), var(--win-title-end));
      border-bottom: 1px solid var(--win-accent);
      color: var(--win-title-text);
      font-weight: bold;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }
    .retro-win .retro-titlebar .icon { color: var(--win-title-text); }

    .retro-win .retro-body { padding: 10px; }

    .retro-win .retro-preview {
      background: var(--win-inset-bg);
      overflow: hidden;
      margin-bottom: 12px;
      aspect-ratio: 16 / 9;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .retro-win #preview-placeholder { color: var(--win-text-dim); font-size: 0.9em; }

    .retro-win .retro-group {
      border: none;
      padding: 8px 10px 10px;
      margin: 0 0 12px;
      background: var(--win-face);
    }
    .retro-win .retro-group.bevel-out {
      border-top: 1px solid var(--win-face-darker);
      border-left: 1px solid var(--win-face-darker);
      border-right: 1px solid var(--win-face-light);
      border-bottom: 1px solid var(--win-face-light);
      box-shadow: none;
    }
    .retro-win .retro-group legend {
      padding: 0 4px;
      font-size: 10px;
      color: var(--win-accent);
      text-transform: uppercase;
      letter-spacing: 0.1em;
    }

    .retro-win .retro-controls-row {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }
    .retro-win .retro-controls-row select { width: auto; flex: 0 1 230px; min-width: 150px; margin-bottom: 0; }

    .retro-win .retro-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      flex: 0 0 auto;
      padding: 6px 14px;
      background: var(--win-face-raised);
      color: var(--win-text);
      border: none;
      border-radius: 0;
      font-family: inherit;
      font-size: 12px;
      cursor: pointer;
      border-top: 1px solid var(--win-face-light);
      border-left: 1px solid var(--win-face-light);
      border-right: 1px solid var(--win-face-darker);
      border-bottom: 1px solid var(--win-face-darker);
      box-shadow: inset 1px 1px 0 var(--win-edge-bright), inset -1px -1px 0 var(--win-face-darker);
    }
    .retro-win .retro-btn:hover { background: #1e242c; filter: none; }
    .retro-win .retro-btn:active {
      border-top: 1px solid var(--win-face-darker);
      border-left: 1px solid var(--win-face-darker);
      border-right: 1px solid var(--win-face-light);
      border-bottom: 1px solid var(--win-face-light);
      box-shadow: inset 1px 1px 0 var(--win-face-darker), inset -1px -1px 0 var(--win-edge-bright);
    }
    .retro-win .retro-btn:disabled, .retro-win .retro-btn:disabled:hover {
      opacity: 0.5;
      cursor: not-allowed;
      filter: none;
    }

    .retro-win #cast-btn.btn-primary { color: #7ee787; }
    .retro-win #cast-btn.btn-danger,
    .retro-win #mic-btn.btn-danger { color: #ff7b72; }

    .retro-win .retro-select {
      background: var(--win-field-bg);
      color: var(--win-text);
      border-radius: 0;
      border-top: 1px solid var(--win-face-darker);
      border-left: 1px solid var(--win-face-darker);
      border-right: 1px solid var(--win-face-light);
      border-bottom: 1px solid var(--win-face-light);
      box-shadow: inset 1px 1px 0 var(--win-face-dark);
      padding: 4px 6px;
      font-family: inherit;
      font-size: 12px;
    }

    .retro-win .retro-note {
      display: none;
      font-size: 11px;
      color: var(--win-text-dim);
      margin-top: 8px;
    }

    .retro-win .icon { width: 16px; height: 16px; flex: none; }

    .retro-win .retro-statusbar {
      display: flex;
      flex-wrap: wrap;
      background: var(--win-inset-bg);
      border-top: 1px solid var(--win-face-darker);
      margin: 0 10px 10px;
    }
    .retro-win .retro-statuscell {
      flex: 1 1 0;
      min-width: 64px;
      padding: 3px 8px;
      font-size: 11px;
      border-right: 1px solid var(--win-face-dark);
      border-left: 1px solid var(--win-face-light);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .retro-win .retro-statuscell:first-child { border-left: none; }
    .retro-win .retro-statuscell:last-child { border-right: none; }
    .retro-win .retro-statuscell-status { flex: 2 1 0; min-width: 130px; }
    .retro-win .stat-icon {
      width: 12px;
      height: 12px;
      vertical-align: -2px;
      margin-right: 5px;
      color: var(--win-accent);
      opacity: 0.8;
    }

    .retro-win #status.live { color: #7ee787; }
    .retro-win #status.error { color: #ff7b72; }
  </style>
</head>
<body>

  <header>
    <div class="header-left">
      <a class="brand" href="{{ url_for('index') }}">
        <img src="{{ url_for('static', filename='logo.png') }}" alt="">
        <span class="brand-name">RakuSpace</span>
      </a>
      <span class="page-title">Go Live!</span>
    </div>
    <a class="login-btn" href="{{ url_for('index') }}">&larr; Back to Home</a>
  </header>

  <main class="golive centered">
    <div class="retro-win">
      <svg style="display:none">
        <symbol id="icon-broadcast" viewBox="0 0 24 24">
          <path d="M12 15v6" stroke="currentColor" fill="none" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M12 15a2 2 0 1 0 0-4 2 2 0 0 0 0 4Z" fill="currentColor" stroke="none"/>
          <path d="M8 9c-1.3 1-2 2.3-2 4s.7 3 2 4" stroke="currentColor" fill="none" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M16 9c1.3 1 2 2.3 2 4s-.7 3-2 4" stroke="currentColor" fill="none" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M5 6c-2 1.8-3 4-3 7s1 5.2 3 7" stroke="currentColor" fill="none" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M19 6c2 1.8 3 4 3 7s-1 5.2-3 7" stroke="currentColor" fill="none" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
        </symbol>
        <symbol id="icon-stop" viewBox="0 0 24 24">
          <rect x="5" y="5" width="14" height="14" fill="currentColor" stroke="none"/>
        </symbol>
        <symbol id="icon-mic-on" viewBox="0 0 24 24">
          <rect x="9" y="3" width="6" height="11" rx="3" stroke="currentColor" fill="none" stroke-width="2.5"/>
          <path d="M6 11c0 3.3 2.7 6 6 6s6-2.7 6-6" stroke="currentColor" fill="none" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M12 17v4" stroke="currentColor" fill="none" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M8 21h8" stroke="currentColor" fill="none" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
        </symbol>
        <symbol id="icon-mic-off" viewBox="0 0 24 24">
          <rect x="9" y="3" width="6" height="11" rx="3" stroke="currentColor" fill="none" stroke-width="2.5"/>
          <path d="M6 11c0 3.3 2.7 6 6 6s6-2.7 6-6" stroke="currentColor" fill="none" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M12 17v4" stroke="currentColor" fill="none" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M8 21h8" stroke="currentColor" fill="none" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M4 4l16 16" stroke="currentColor" fill="none" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
        </symbol>
        <symbol id="icon-film" viewBox="0 0 24 24">
          <rect x="3" y="5" width="18" height="14" rx="1" stroke="currentColor" fill="none" stroke-width="2.5" stroke-linejoin="round"/>
          <path d="M3 10h18M3 14h18M8 5v14M16 5v14" stroke="currentColor" fill="none" stroke-width="2" stroke-linecap="round"/>
        </symbol>
        <symbol id="icon-speaker" viewBox="0 0 24 24">
          <path d="M4 9h4l5-4v14l-5-4H4z" stroke="currentColor" fill="none" stroke-width="2.5" stroke-linejoin="round"/>
          <path d="M17 9c1.3 1.3 1.3 4.7 0 6" stroke="currentColor" fill="none" stroke-width="2.5" stroke-linecap="round"/>
        </symbol>
        <symbol id="icon-monitor" viewBox="0 0 24 24">
          <rect x="3" y="4" width="18" height="12" rx="1" stroke="currentColor" fill="none" stroke-width="2.5" stroke-linejoin="round"/>
          <path d="M9 20h6" stroke="currentColor" fill="none" stroke-width="2.5" stroke-linecap="round"/>
          <path d="M12 16v4" stroke="currentColor" fill="none" stroke-width="2.5" stroke-linecap="round"/>
        </symbol>
      </svg>

      <div class="retro-titlebar">
        <svg class="icon"><use href="#icon-monitor"></use></svg>
        <span>Screenshare Control</span>
      </div>
      <div class="retro-body">
        <div id="preview-wrap" class="retro-preview bevel-in">
          <video id="preview" autoplay muted playsinline></video>
          <span id="preview-placeholder">No preview yet</span>
        </div>

        <fieldset class="retro-group bevel-out">
          <legend>Controls</legend>
          <div class="controls-row retro-controls-row">
            <button id="cast-btn" class="btn-primary retro-btn" type="button">
              <svg class="icon"><use href="#icon-broadcast"></use></svg>
              <span id="cast-btn-label">Start casting</span>
            </button>
            <button id="mic-btn" class="secondary retro-btn" type="button" disabled>
              <svg class="icon"><use href="#icon-mic-off"></use></svg>
              <span id="mic-btn-label">Enable mic</span>
            </button>
            <select id="mic-select" class="retro-select" disabled>
              <option value="">Default microphone</option>
            </select>
          </div>
          <div id="unconfigured-note" class="retro-note">
            Screenshare publishing isn't configured on this server yet.
          </div>
        </fieldset>
      </div>

      <div class="retro-statusbar bevel-in">
        <div class="retro-statuscell retro-statuscell-status"><span id="status">Ready.</span></div>
        <div class="retro-statuscell" title="Video codec">
          <svg class="icon stat-icon"><use href="#icon-film"></use></svg><span id="stat-video-codec">&mdash;</span>
        </div>
        <div class="retro-statuscell" title="Resolution"><span id="stat-resolution">&mdash;</span></div>
        <div class="retro-statuscell" title="Frame rate"><span id="stat-fps">&mdash;</span></div>
        <div class="retro-statuscell" title="Video bitrate"><span id="stat-video-bitrate">&mdash;</span></div>
        <div class="retro-statuscell" title="Audio codec">
          <svg class="icon stat-icon"><use href="#icon-speaker"></use></svg><span id="stat-audio-codec">&mdash;</span>
        </div>
      </div>
    </div>
  </main>

  <script src="{{ url_for('static', filename='ovenlivekit/OvenLiveKit.min.js') }}"></script>
  <script>
    const whipUrl = {{ whip_url | tojson }};

    const castBtn = document.getElementById("cast-btn");
    const micBtn = document.getElementById("mic-btn");
    const micSelect = document.getElementById("mic-select");
    const status = document.getElementById("status");
    const previewWrap = document.getElementById("preview-wrap");
    const preview = document.getElementById("preview");
    const previewPlaceholder = document.getElementById("preview-placeholder");
    const unconfiguredNote = document.getElementById("unconfigured-note");
    const castLabel = document.getElementById("cast-btn-label");
    const micLabel = document.getElementById("mic-btn-label");
    const castIcon = castBtn.querySelector("use");
    const micIcon = micBtn.querySelector("use");

    const statVideoCodec = document.getElementById("stat-video-codec");
    const statResolution = document.getElementById("stat-resolution");
    const statFps = document.getElementById("stat-fps");
    const statVideoBitrate = document.getElementById("stat-video-bitrate");
    const statAudioCodec = document.getElementById("stat-audio-codec");

    let olk = null;
    let displayStream = null;
    let micTrack = null;
    let micMuted = false;
    let live = false;
    let statsTimer = null;
    let lastStatsSample = null;

    // Desktop/tab audio (from getDisplayMedia) and the mic are mixed through
    // a Web Audio graph into one steady output track, rather than swapping
    // which raw track is attached to the peer connection. That mixed track's
    // identity never changes across a mic mute or device switch, so those
    // only ever rewire the graph -- no renegotiation or replaceTrack needed.
    let audioCtx = null;
    let destinationNode = null;
    let displaySourceNode = null;
    let micGainNode = null;
    let micSourceNode = null;

    let reconnectTimer = null;
    let reconnectAttempt = 0;
    const RECONNECT_BASE_DELAY_MS = 2000;
    const RECONNECT_MAX_DELAY_MS = 10000;

    function setStatus(text, cls) {
      status.textContent = text || "";
      status.className = cls || "";
    }

    function resetStats() {
      lastStatsSample = null;
      statVideoCodec.textContent = "—";
      statResolution.textContent = "—";
      statFps.textContent = "—";
      statVideoBitrate.textContent = "—";
      statAudioCodec.textContent = "—";
    }

    if (!whipUrl) {
      castBtn.disabled = true;
      unconfiguredNote.style.display = "";
    }

    // Desktop/tab audio support depends entirely on what the browser's own
    // screenshare picker offers (e.g. Chrome's "share tab audio" checkbox,
    // absent for a plain window/screen share) -- we just ask for it and take
    // whatever getDisplayMedia hands back. Mic is layered on top of that via
    // the Web Audio graph below so a streamer gets both when available.
    async function startCasting() {
      castBtn.disabled = true;
      setStatus("Requesting screen…");
      try {
        displayStream = await navigator.mediaDevices.getDisplayMedia({ video: true, audio: true });
      } catch (err) {
        setStatus("Screen share cancelled or denied.", "error");
        castBtn.disabled = false;
        return;
      }
      displayStream.getVideoTracks().forEach(track => {
        track.addEventListener("ended", () => { if (live) stopCasting(); });
      });

      setupAudioGraph();

      olk = OvenLiveKit.create({
        callbacks: {
          error: handlePublishError,
          connected: handleConnected,
          connectionClosed: handleConnectionClosed,
          iceStateChange: handleIceStateChange,
        },
      });
      olk.attachMedia(preview);

      const combined = buildCombinedStream();
      await olk.setMediaStream(combined);
      preview.muted = true;
      preview.classList.add("active");
      previewPlaceholder.style.display = "none";

      await populateMicDevices();
      micBtn.disabled = false;
      micSelect.disabled = false;

      setStatus("Connecting to stream server…");
      try {
        await olk.startStreaming(whipUrl, { preferredVideoFormat: "H264" });
        live = true;
        castLabel.textContent = "Stop stream";
        castIcon.setAttribute("href", "#icon-stop");
        castBtn.classList.remove("btn-primary");
        castBtn.classList.add("btn-danger");
        setStatus("Live!", "live");
        startStatsPolling();
      } catch (err) {
        setStatus("Failed to start stream: " + (err && err.message ? err.message : err), "error");
        teardown();
      } finally {
        castBtn.disabled = false;
      }
    }

    function buildCombinedStream() {
      return new MediaStream([
        ...displayStream.getVideoTracks(),
        ...destinationNode.stream.getAudioTracks(),
      ]);
    }

    // Sets up the mix destination and wires in desktop/tab audio, if the
    // browser gave us any. The mic side is wired in separately by
    // acquireMic() once mic permission is granted (or re-wired on device
    // switch), independent of whether display audio is present.
    function setupAudioGraph() {
      audioCtx = new AudioContext();
      destinationNode = audioCtx.createMediaStreamDestination();

      const displayAudioTrack = displayStream.getAudioTracks()[0];
      if (displayAudioTrack) {
        displaySourceNode = audioCtx.createMediaStreamSource(new MediaStream([displayAudioTrack]));
        displaySourceNode.connect(destinationNode);
        displayAudioTrack.addEventListener("ended", () => {
          if (displaySourceNode) { displaySourceNode.disconnect(); displaySourceNode = null; }
        });
      }

      micGainNode = audioCtx.createGain();
      micGainNode.gain.value = micMuted ? 0 : 1;
      micGainNode.connect(destinationNode);
    }

    async function acquireMic(deviceId) {
      const constraints = { audio: deviceId ? { deviceId: { exact: deviceId } } : true };
      const stream = await navigator.mediaDevices.getUserMedia(constraints);
      const newTrack = stream.getAudioTracks()[0];

      if (micSourceNode) micSourceNode.disconnect();
      if (micTrack) micTrack.stop();

      micTrack = newTrack;
      micSourceNode = audioCtx.createMediaStreamSource(new MediaStream([micTrack]));
      micSourceNode.connect(micGainNode);
    }

    async function populateMicDevices() {
      try {
        const devices = await OvenLiveKit.getDevices("audio");
        const inputs = (devices && devices.audioinput) || [];
        const current = micSelect.value;
        micSelect.innerHTML = "";
        const defaultOpt = document.createElement("option");
        defaultOpt.value = "";
        defaultOpt.textContent = "Default microphone";
        micSelect.appendChild(defaultOpt);
        inputs.forEach(dev => {
          const opt = document.createElement("option");
          opt.value = dev.deviceId;
          opt.textContent = dev.label || "Microphone";
          micSelect.appendChild(opt);
        });
        if (current) micSelect.value = current;
      } catch (err) {
        // Device labels/enumeration failed; keep the default-only option.
      }
    }

    // Only swaps the live track if the mic has already been explicitly
    // turned on -- picking a device beforehand just records the preference
    // for whenever the user does enable it, it doesn't request mic access
    // (and therefore doesn't turn the mic on) by itself.
    micSelect.addEventListener("change", async () => {
      if (!micTrack) return;
      try {
        await acquireMic(micSelect.value || undefined);
      } catch (err) {
        setStatus("Couldn't switch microphone: " + (err && err.message ? err.message : err), "error");
      }
    });

    // First click requests mic access and enables it (unmuted); once a mic
    // track exists, the button just toggles mute. A previously-granted mic
    // permission means acquireMic() here won't prompt again, but it still
    // only happens on an explicit click -- a reload or restarted stream
    // never opens the mic on its own.
    micBtn.addEventListener("click", async () => {
      if (!micGainNode) return;
      if (!micTrack) {
        try {
          await acquireMic(micSelect.value || undefined);
        } catch (err) {
          setStatus("Microphone access denied.", "error");
          return;
        }
        micLabel.textContent = "Mute mic";
        micIcon.setAttribute("href", "#icon-mic-on");
        return;
      }
      micMuted = !micMuted;
      micGainNode.gain.value = micMuted ? 0 : 1;
      micLabel.textContent = micMuted ? "Unmute mic" : "Mute mic";
      micIcon.setAttribute("href", micMuted ? "#icon-mic-off" : "#icon-mic-on");
      micBtn.classList.toggle("btn-danger", micMuted);
    });

    function handlePublishError(err) {
      if (!live) return;
      setStatus("Stream error: " + (err && err.message ? err.message : "connection problem"), "error");
      scheduleReconnect();
    }

    function handleConnected() {
      reconnectAttempt = 0;
      setStatus("Live!", "live");
    }

    function handleConnectionClosed(type, event) {
      if (!live || type === "user") return;
      scheduleReconnect();
    }

    function handleIceStateChange(state) {
      if (!live) return;
      if (state === "failed" || state === "disconnected" || state === "closed") {
        scheduleReconnect();
      }
    }

    // WebRTC's own disconnect handling is what gives WHIP a much clunkier
    // reconnect story than RTMP: a browser RTCPeerConnection just sits in a
    // dead state forever unless something actively rebuilds it. Reuses the
    // existing captured tracks (no re-prompting for screen share) and redoes
    // the WHIP publish with backoff until it succeeds or the user stops.
    function scheduleReconnect() {
      if (!live || reconnectTimer) return;
      stopStatsPolling();
      reconnectAttempt += 1;
      const delay = Math.min(RECONNECT_BASE_DELAY_MS * reconnectAttempt, RECONNECT_MAX_DELAY_MS);
      setStatus("Connection lost, reconnecting…", "error");
      reconnectTimer = setTimeout(async () => {
        reconnectTimer = null;
        try {
          if (olk) { try { await olk.stopStreaming(); } catch (e) { /* best-effort */ } }
          await olk.setMediaStream(buildCombinedStream());
          await olk.startStreaming(whipUrl, { preferredVideoFormat: "H264" });
          setStatus("Live!", "live");
          startStatsPolling();
        } catch (err) {
          scheduleReconnect();
        }
      }, delay);
    }

    function startStatsPolling() {
      stopStatsPolling();
      statsTimer = setInterval(pollStats, 2000);
      pollStats();
    }

    function stopStatsPolling() {
      if (statsTimer) { clearInterval(statsTimer); statsTimer = null; }
    }

    async function pollStats() {
      if (!olk || !olk.peerConnection) return;
      let report;
      try {
        report = await olk.peerConnection.getStats();
      } catch (err) {
        return;
      }

      const codecs = new Map();
      let outboundVideo = null;
      let outboundAudio = null;
      report.forEach(entry => {
        if (entry.type === "codec") codecs.set(entry.id, entry);
        if (entry.type === "outbound-rtp" && entry.kind === "video") outboundVideo = entry;
        if (entry.type === "outbound-rtp" && entry.kind === "audio") outboundAudio = entry;
      });

      const now = performance.now();
      if (outboundVideo) {
        const codec = codecs.get(outboundVideo.codecId);
        statVideoCodec.textContent = codec ? codec.mimeType.replace("video/", "") : "—";
        if (outboundVideo.frameWidth && outboundVideo.frameHeight) {
          statResolution.textContent = `${outboundVideo.frameWidth}×${outboundVideo.frameHeight}`;
        }
        if (outboundVideo.framesPerSecond) {
          statFps.textContent = Math.round(outboundVideo.framesPerSecond) + " fps";
        }

        if (lastStatsSample && lastStatsSample.videoBytes !== undefined) {
          const dt = (now - lastStatsSample.time) / 1000;
          const dBytes = outboundVideo.bytesSent - lastStatsSample.videoBytes;
          if (dt > 0) {
            const kbps = Math.max(0, Math.round((dBytes * 8) / dt / 1000));
            statVideoBitrate.textContent = kbps + " kbps";
          }
        }
      }

      if (outboundAudio) {
        const codec = codecs.get(outboundAudio.codecId);
        statAudioCodec.textContent = codec ? codec.mimeType.replace("audio/", "") : "—";
      } else {
        statAudioCodec.textContent = "none";
      }

      lastStatsSample = {
        time: now,
        videoBytes: outboundVideo ? outboundVideo.bytesSent : undefined,
      };
    }

    // WHIP publish rejections are mostly deterministic HTTP status codes --
    // OvenLiveKit surfaces the raw fetch failure, so we don't get the status
    // code directly, but the message text carries enough for the user.
    async function stopCasting() {
      castBtn.disabled = true;
      if (reconnectTimer) { clearTimeout(reconnectTimer); reconnectTimer = null; }
      reconnectAttempt = 0;
      stopStatsPolling();
      if (olk) {
        try { await olk.stopStreaming(); } catch (err) { /* best-effort */ }
      }
      teardown();
      setStatus("");
      castBtn.disabled = false;
    }

    function teardown() {
      live = false;
      if (olk) { olk.remove(); olk = null; }
      if (displayStream) { displayStream.getTracks().forEach(track => track.stop()); displayStream = null; }
      if (micTrack) { micTrack.stop(); micTrack = null; }
      if (micSourceNode) { micSourceNode.disconnect(); micSourceNode = null; }
      if (displaySourceNode) { displaySourceNode.disconnect(); displaySourceNode = null; }
      if (micGainNode) { micGainNode.disconnect(); micGainNode = null; }
      destinationNode = null;
      if (audioCtx) { audioCtx.close(); audioCtx = null; }
      micMuted = false;
      preview.srcObject = null;
      preview.classList.remove("active");
      previewPlaceholder.style.display = "";
      castLabel.textContent = "Start casting";
      castIcon.setAttribute("href", "#icon-broadcast");
      castBtn.classList.remove("btn-danger");
      castBtn.classList.add("btn-primary");
      micLabel.textContent = "Enable mic";
      micIcon.setAttribute("href", "#icon-mic-off");
      micBtn.classList.remove("btn-danger");
      micBtn.disabled = true;
      micSelect.disabled = true;
      resetStats();
    }

    castBtn.addEventListener("click", () => {
      if (live) {
        stopCasting();
      } else {
        startCasting();
      }
    });
  </script>
</body>
</html>
