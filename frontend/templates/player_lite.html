<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Watching {{ streamname }}</title>
  <script src="{{ url_for('static', filename='hls/hls.min.js') }}"></script>
  <style>
    :root {
      /* Catppuccin Macchiato */
      --ctp-crust: #181926;
      --ctp-mantle: #1e2030;
      --ctp-base: #24273a;
      --ctp-surface0: #363a4f;
      --ctp-surface1: #494d64;
      --ctp-surface2: #5b6078;
      --ctp-overlay0: #6e738d;
      --ctp-overlay1: #8087a2;
      --ctp-subtext0: #a5adcb;
      --ctp-subtext1: #b8c0e0;
      --ctp-text: #cad3f5;
      --ctp-pink: #f5bde6;
      --ctp-lavender: #b7bdf8;
      --ctp-red: #ed8796;
      /* See static/app.css for what these two roles mean. */
      --accent: var(--ctp-pink);
      --focus-ring: var(--ctp-lavender);
    }

    *, *::before, *::after { box-sizing: border-box; }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      background: #000;
      overflow: hidden;
      font-family: sans-serif;
    }

    #stage {
      position: relative;
      width: 100%;
      height: 100vh;
      background: #000;
    }

    video {
      width: 100%;
      height: 100%;
      background: #000;
      display: block;
    }

    #title-overlay {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      padding: 14px 18px;
      color: var(--ctp-text);
      background: linear-gradient(to bottom, rgba(24,25,38,0.85), transparent);
      font-size: 1em;
      font-weight: 600;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.2s ease;
    }
    #stage:hover #title-overlay,
    #stage.show-ui #title-overlay { opacity: 1; }

    #offline {
      position: absolute;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      color: var(--ctp-subtext1);
      font-size: 1.4em;
      background: var(--ctp-crust);
      background-size: cover;
      background-position: center;
      text-align: center;
      padding: 0 16px;
    }
    #offline.has-image::before {
      content: "";
      position: absolute;
      inset: 0;
      background: rgba(24, 25, 38, 0.55);
    }
    #offline span {
      position: relative;
    }

    #controls {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 14px;
      background: linear-gradient(to top, rgba(24,25,38,0.9), transparent);
      opacity: 0;
      transition: opacity 0.2s ease;
    }
    #stage:hover #controls,
    #stage.show-ui #controls { opacity: 1; }

    #controls button {
      background: none;
      border: none;
      color: var(--ctp-text);
      cursor: pointer;
      font-size: 1.1em;
      padding: 4px 8px;
      border-radius: 4px;
      line-height: 1;
    }
    #controls button:hover { color: var(--accent); background: var(--ctp-surface0); }
    #controls button:focus-visible,
    #volume:focus-visible {
      outline: 2px solid var(--focus-ring);
      outline-offset: 2px;
    }
    /* Keyboard users need the bar visible while tabbing through it. */
    #stage:focus-within #controls,
    #stage:focus-within #title-overlay { opacity: 1; }

    #volume {
      width: 90px;
      accent-color: var(--accent);
    }

    #controls .spacer { flex: 1; }

    @media (prefers-reduced-motion: reduce) {
      #controls, #title-overlay { transition: none; }
    }
  </style>
</head>
<body>
  <div id="stage">
    <video id="video" playsinline muted></video>
    <div id="title-overlay">{{ streamtitle }}</div>
    <div id="offline"><span>{{ streamname }} is offline</span></div>

    <div id="controls">
      <button id="playBtn" type="button" title="Play/Pause" aria-label="Play or pause">▶</button>
      <button id="muteBtn" type="button" title="Mute/Unmute" aria-label="Mute or unmute">🔇</button>
      <input id="volume" type="range" min="0" max="1" step="0.05" value="1" aria-label="Volume">
      <div class="spacer"></div>
      <button id="pipBtn" type="button" title="Picture-in-Picture" aria-label="Picture-in-picture">🗗</button>
      <button id="fullscreenBtn" type="button" title="Fullscreen" aria-label="Fullscreen">⛶</button>
    </div>
  </div>

  <script>
    const streamName = "{{ streamname }}";
    const host = "{{ OME_LLHLS_HOST }}";
    const port = "{{ OME_LLHLS_PORT }}";
    const appName = "{{ OME_APP_NAME }}";
    const offlineImageUrl = {{ (offline_image_url or "") | tojson }};

    const streamUrl = `https://${host}:${port}/${appName}/${streamName}/llhls.m3u8`;

    const video = document.getElementById("video");
    const stage = document.getElementById("stage");
    const offlineMsg = document.getElementById("offline");
    const playBtn = document.getElementById("playBtn");
    const muteBtn = document.getElementById("muteBtn");
    const volume = document.getElementById("volume");
    const pipBtn = document.getElementById("pipBtn");
    const fullscreenBtn = document.getElementById("fullscreenBtn");

    if (offlineImageUrl) {
      offlineMsg.style.backgroundImage = `url("${offlineImageUrl.replace(/"/g, "%22")}")`;
      offlineMsg.classList.add("has-image");
    }

    if (!document.pictureInPictureEnabled) {
      pipBtn.style.display = "none";
    }

    let hls = null;
    let liveState = null; // "live" | "offline", set by the /api/live SSE push below
    let localRetryTimer = null;

    function setOffline() {
      offlineMsg.style.display = "flex";
      video.style.display = "none";
      // Only worth retrying on our own if OME still thinks the stream is up
      // (a transient viewer-side glitch); if OME says offline, there's
      // nothing to reconnect to until the push below says otherwise.
      if (liveState === "live") {
        clearTimeout(localRetryTimer);
        localRetryTimer = setTimeout(loadStream, 3000);
      }
    }

    function setOnline() {
      clearTimeout(localRetryTimer);
      offlineMsg.style.display = "none";
      video.style.display = "block";
    }

    function attemptAutoplay() {
      video.play().catch(() => {
        // Autoplay was blocked; fall back to muted autoplay.
        video.muted = true;
        muteBtn.textContent = "🔇";
        video.play().catch(() => {});
      });
    }

    function loadStream() {
      clearTimeout(localRetryTimer);

      if (video.canPlayType("application/vnd.apple.mpegurl")) {
        // Safari: native HLS support, no hls.js needed.
        video.src = streamUrl;
        video.addEventListener("loadedmetadata", () => { setOnline(); attemptAutoplay(); }, { once: true });
        video.addEventListener("error", setOffline, { once: true });
        return;
      }

      if (!window.Hls || !Hls.isSupported()) {
        setOffline();
        return;
      }

      if (hls) {
        hls.destroy();
      }
      hls = new Hls({ lowLatencyMode: true });
      hls.loadSource(streamUrl);
      hls.attachMedia(video);

      hls.on(Hls.Events.MANIFEST_PARSED, () => {
        setOnline();
        attemptAutoplay();
      });

      hls.on(Hls.Events.ERROR, (event, data) => {
        if (data.fatal) {
          setOffline();
        }
      });
    }

    // --- Controls ---
    function updatePlayBtn() {
      playBtn.textContent = video.paused ? "▶" : "⏸";
    }
    function updateMuteBtn() {
      muteBtn.textContent = video.muted || video.volume === 0 ? "🔇" : "🔊";
    }

    playBtn.addEventListener("click", () => {
      if (video.paused) video.play(); else video.pause();
    });
    video.addEventListener("play", updatePlayBtn);
    video.addEventListener("pause", updatePlayBtn);

    muteBtn.addEventListener("click", () => {
      video.muted = !video.muted;
      if (!video.muted && video.volume === 0) video.volume = 1;
      volume.value = video.muted ? 0 : video.volume;
      updateMuteBtn();
    });
    volume.addEventListener("input", () => {
      video.volume = volume.value;
      video.muted = Number(volume.value) === 0;
      updateMuteBtn();
    });

    fullscreenBtn.addEventListener("click", () => {
      if (document.fullscreenElement) {
        document.exitFullscreen();
      } else {
        stage.requestFullscreen().catch(() => {});
      }
    });

    if (document.pictureInPictureEnabled) {
      pipBtn.addEventListener("click", () => {
        if (document.pictureInPictureElement) {
          document.exitPictureInPicture();
        } else {
          video.requestPictureInPicture().catch(() => {});
        }
      });
    }

    function togglePlay() {
      if (video.paused) video.play(); else video.pause();
    }

    // Click anywhere on the stage (but not on the controls bar) to toggle
    // play/pause, and briefly reveal the controls for touch devices. While
    // offline, there's nothing loaded to toggle (loadStream() only ever runs
    // off the SSE "live" event), so this instead always attempts a connection
    // directly against OME -- a manual escape hatch that works even if our
    // tracked liveState is stale (e.g. right after a server restart).
    stage.addEventListener("click", (e) => {
      if (e.target.closest("#controls")) return;
      if (offlineMsg.style.display === "flex") {
        loadStream();
      } else {
        togglePlay();
      }
      stage.classList.add("show-ui");
      clearTimeout(stage._uiTimer);
      stage._uiTimer = setTimeout(() => stage.classList.remove("show-ui"), 2500);
    });

    document.addEventListener("keydown", (e) => {
      if (e.code !== "Space") return;
      const tag = document.activeElement && document.activeElement.tagName;
      if (tag === "INPUT" || tag === "TEXTAREA" || tag === "BUTTON") return;
      e.preventDefault();
      togglePlay();
    });

    updatePlayBtn();
    updateMuteBtn();

    // Drive connect attempts entirely off OME's own publish start/stop
    // events (relayed via /auth/ome into this SSE feed) instead of blindly
    // polling the manifest: only try to load when we're actually told the
    // stream is live, and stop trying the instant we're told it isn't.
    const liveEvents = new EventSource(`/api/live/${streamName}/events`);
    liveEvents.addEventListener("state", (e) => {
      const state = e.data;
      if (state === liveState) return;
      liveState = state;
      if (state === "live") {
        loadStream();
      } else {
        setOffline();
      }
    });
  </script>
</body>
</html>
