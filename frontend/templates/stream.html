
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Streaming Info</title>
  <style>
    :root {
      /* Catppuccin Macchiato */
      --ctp-crust: #181926;
      --ctp-mantle: #1e2030;
      --ctp-base: #24273a;
      --ctp-surface0: #363a4f;
      --ctp-surface1: #494d64;
      --ctp-surface2: #5b6078;
      --ctp-overlay0: #6e738d;
      --ctp-overlay1: #8087a2;
      --ctp-subtext0: #a5adcb;
      --ctp-subtext1: #b8c0e0;
      --ctp-text: #cad3f5;
      --ctp-pink: #f5bde6;
      --ctp-red: #ed8796;
    }

    *, *::before, *::after { box-sizing: border-box; }

    body {
      font-family: sans-serif;
      margin: 0;
      min-height: 100vh;
      background: var(--ctp-base);
      color: var(--ctp-text);
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 24px;
      height: 48px;
      background: var(--ctp-crust);
      border-bottom: 1px solid var(--ctp-surface0);
    }
    header .page-title { font-size: 0.95em; font-weight: 600; color: var(--ctp-subtext1); }
    header a.login-btn {
      font-size: 0.8em;
      color: var(--ctp-subtext0);
      text-decoration: none;
      padding: 4px 10px;
      border: 1px solid var(--ctp-surface1);
      border-radius: 4px;
    }
    header a.login-btn:hover { color: var(--ctp-text); border-color: var(--ctp-surface2); }

    main {
      max-width: 640px;
      margin: 0 auto;
      padding: 24px;
    }

    .section-heading { font-size: 1.05em; font-weight: 600; color: var(--ctp-subtext1); margin: 0 0 8px 2px; }

    .card {
      background: var(--ctp-surface0);
      border: 1px solid var(--ctp-surface1);
      border-radius: 8px;
      padding: 20px 24px;
      margin-bottom: 24px;
    }

    label { display: block; font-size: 0.85em; color: var(--ctp-subtext0); margin: 0 0 4px; }
    label.inline { display: inline; margin: 0 0 0 6px; color: var(--ctp-text); }

    input[type="text"], input[type="password"] {
      width: 100%;
      padding: 7px 10px;
      font-size: 0.95em;
      background: var(--ctp-mantle);
      border: 1px solid var(--ctp-surface2);
      border-radius: 4px;
      color: var(--ctp-text);
      outline: none;
      font-family: inherit;
    }
    input[type="text"]:focus, input[type="password"]:focus { border-color: var(--ctp-overlay1); }
    input[type="text"][readonly], input[type="password"][readonly] { color: var(--ctp-subtext0); }
    input[type="text"]:disabled, input[type="password"]:disabled { opacity: 0.6; }

    .field-row { display: flex; gap: 6px; margin-bottom: 14px; }
    .field-row input, .field-row .key-wrap { margin-bottom: 0; flex: 1; min-width: 0; }

    .key-wrap { overflow: hidden; border-radius: 4px; }
    .key-wrap input { width: 100%; }

    .checkbox-row { display: flex; align-items: center; margin: 4px 0 14px; }
    .checkbox-row input { width: auto; margin: 0; accent-color: var(--ctp-pink); }

    .config-link { font-size: 0.85em; color: var(--ctp-subtext0); }
    .config-link a { color: inherit; }

    button {
      padding: 8px 16px;
      font-size: 0.95em;
      background: var(--ctp-surface1);
      color: var(--ctp-text);
      border: 1px solid var(--ctp-surface2);
      border-radius: 4px;
      cursor: pointer;
    }
    button:hover { background: var(--ctp-surface2); }

    .copy-btn {
      flex: 0 0 auto;
      padding: 0 12px;
      font-size: 0.85em;
      font-weight: 600;
      background: var(--ctp-pink);
      color: var(--ctp-crust);
      border: 1px solid var(--ctp-pink);
    }
    .copy-btn:hover { filter: brightness(1.08); background: var(--ctp-pink); }

    input#streamkey.blurred { filter: blur(4.5px); cursor: pointer; }

    .key-actions { display: flex; align-items: center; gap: 12px; margin-top: 4px; }
    .key-actions form { margin: 0; }

    .regen-btn {
      font-size: 0.85em;
      padding: 6px 12px;
      background: var(--ctp-mantle);
      color: var(--ctp-subtext0);
      border: 1px solid var(--ctp-surface2);
    }
    .regen-btn:hover { color: var(--ctp-text); border-color: var(--ctp-overlay1); background: var(--ctp-mantle); }

    .reveal-link { font-size: 0.85em; color: var(--ctp-subtext0); text-decoration: none; }
    .reveal-link:hover { color: var(--ctp-text); text-decoration: underline; }

    .save-btn {
      padding: 10px 28px;
      font-size: 0.95em;
      font-weight: 600;
      background: var(--ctp-pink);
      color: var(--ctp-crust);
      border: 1px solid var(--ctp-pink);
    }
    .save-btn:hover { filter: brightness(1.08); background: var(--ctp-pink); }

    .banner {
      padding: 10px 14px;
      border-radius: 4px;
      margin-bottom: 16px;
      font-size: 0.9em;
      background: var(--ctp-mantle);
      border: 1px solid #5a2a2a;
      color: var(--ctp-red);
    }
  </style>
</head>
<body>

  <header>
    <span class="page-title">Streaming Info for {{ username }}</span>
    <a class="login-btn" href="{{ url_for('index') }}">&larr; Back to Home</a>
  </header>

  <main>
    <h2 class="section-heading">Stream settings</h2>
    <div class="card">
      {% for url in rtmp_urls %}
      <label for="rtmp-{{ loop.index0 }}">{{ "RTMP URL" if loop.first else "Alternate RTMP URL" }}</label>
      <div class="field-row">
        <input type="text" value="{{ url }}" id="rtmp-{{ loop.index0 }}" readonly>
        <button type="button" class="copy-btn" onclick="copyField('rtmp-{{ loop.index0 }}')">Copy</button>
      </div>
      {% endfor %}

      <label for="streamkey">Stream Key</label>
      <div class="field-row">
        <div class="key-wrap">
          <input type="password" value="{{ userid }}_{{ streamkey }}" id="streamkey" readonly onclick="revealKey()">
        </div>
        <button type="button" class="copy-btn" onclick="copyField('streamkey')">Copy</button>
      </div>
      <div class="key-actions">
        <form method="post" action="{{ url_for('regen_key') }}">
          <input type="hidden" name="next_prefix" value="{{ next_prefix }}">
          <button type="submit" class="regen-btn">Regenerate Key</button>
        </form>
        <a href="#" id="reveal-link" class="reveal-link" onclick="revealKey(); return false;">Show key</a>
      </div>
    </div>

    <h2 class="section-heading">Customize</h2>
    <div class="card">
      <form id="settings-form" method="post" action="{{ url_for('save_settings') }}">
        <input type="hidden" name="next_prefix" value="{{ next_prefix }}">
        <label for="streamtitle">Stream Title</label>
        <input type="text" id="streamtitle" name="streamtitle" value="{{ streamtitle }}">

        {% if next_prefix == "/next" %}
        <label for="offline_image_url" style="margin-top: 14px;">Offline Image</label>
        <input type="text" id="offline_image_url" name="offline_image_url" value="{{ offline_image_url or '' }}"
               placeholder="https://example.com/your-image.png">
        {% endif %}
      </form>
    </div>

    <h2 class="section-heading">Notifications</h2>
    <div class="card">
      {% if notify_error %}
      <div class="banner">{{ notify_error }}</div>
      {% endif %}

      <label for="notify_url">Notification URL</label>
      <input type="text" form="settings-form" id="notify_url" name="notify_url" value="{{ notify_url or '' }}"
             placeholder="https://example.com/your-webhook" {% if notify_builtin %}disabled{% endif %}>

      <div class="checkbox-row">
        <input type="checkbox" form="settings-form" id="notify_builtin" name="notify_builtin"
               onchange="document.getElementById('notify_url').disabled = this.checked;"
               {% if notify_builtin %}checked{% endif %}>
        <label class="inline" for="notify_builtin">Use built-in notifications</label><span class="config-link"> - <a href="{{ url_for('notifications_page') }}">Configure</a></span>
      </div>

      <div class="checkbox-row">
        <input type="checkbox" form="settings-form" id="notify_on_live" name="notify_on_live" {% if notify_on_live %}checked{% endif %}>
        <label class="inline" for="notify_on_live">Notify when stream goes live</label>
      </div>
      <div class="checkbox-row">
        <input type="checkbox" form="settings-form" id="notify_on_offline" name="notify_on_offline" {% if notify_on_offline %}checked{% endif %}>
        <label class="inline" for="notify_on_offline">Notify when stream goes offline</label>
      </div>
    </div>

    <button type="submit" form="settings-form" class="save-btn">Save Settings</button>
  </main>

  <script>
    function copyField(id) {
      const el = document.getElementById(id);
      navigator.clipboard.writeText(el.value);
    }

    function revealKey() {
      const el = document.getElementById('streamkey');
      el.type = 'text';
      el.classList.remove('blurred');
      document.getElementById('reveal-link').textContent = 'Hide key';
      document.getElementById('reveal-link').onclick = function() { hideKey(); return false; };
    }

    function hideKey() {
      const el = document.getElementById('streamkey');
      el.classList.add('blurred');
      document.getElementById('reveal-link').textContent = 'Show key';
      document.getElementById('reveal-link').onclick = function() { revealKey(); return false; };
    }

    window.addEventListener('DOMContentLoaded', function() {
      const keyInput = document.getElementById('streamkey');
      keyInput.type = 'text';
      keyInput.classList.add('blurred');
    });
  </script>
</body>
</html>
