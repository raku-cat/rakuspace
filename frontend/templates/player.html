<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Watching {{ streamname }}</title>
  <link rel="icon" href="{{ url_for('static', filename='logo.png') }}">
  <link rel="manifest" href="{{ url_for('static', filename='manifest.webmanifest') }}">
  <script src="{{ url_for('static', filename='pwa.js') }}" defer></script>
  <script src="{{ url_for('static', filename='ovenplayer/ovenplayer.js') }}"></script>
  <style>
    :root {
      /* Catppuccin Macchiato, mirroring static/app.css. Player pages are
         fullscreen video layouts and don't load app.css, so the overlay
         chrome (menu, viewer panel) redeclares the tokens it needs to stay
         on the same palette as the rest of the site. */
      --ctp-crust: #181926;
      --ctp-mantle: #1e2030;
      --ctp-surface0: #363a4f;
      --ctp-surface1: #494d64;
      --ctp-surface2: #5b6078;
      --ctp-overlay1: #8087a2;
      --ctp-subtext0: #a5adcb;
      --ctp-subtext1: #b8c0e0;
      --ctp-text: #cad3f5;
      --ctp-pink: #f5bde6;
      --ctp-lavender: #b7bdf8;
      /* See static/app.css for what these two roles mean. */
      --accent: var(--ctp-pink);
      --focus-ring: var(--ctp-lavender);
    }
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
      font-family: sans-serif;
    }
    .layout {
      display: flex;
      width: 100vw;
      height: 100vh;
    }
    .video-pane {
      flex: 1 1 0;
      height: 100%;
      position: relative;
      overflow: hidden;
      min-width: 0;
    }
    #player {
      width: 100%;
      height: 100%;
    }

    /* --- global menu burger --- */

    .menu-wrap {
      position: fixed;
      top: 10px;
      right: 10px;
      z-index: 100;
    }
    .global-menu-btn {
      width: 36px;
      height: 36px;
      border: 1px solid var(--ctp-surface1);
      border-radius: 4px;
      background: rgba(24, 25, 38, 0.85);
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 4px;
      opacity: 0;
      transition: opacity 0.25s ease;
    }
    .global-menu-btn:hover { border-color: var(--ctp-surface2); }
    .global-menu-btn span {
      display: block;
      width: 18px;
      height: 2px;
      background: var(--ctp-subtext0);
    }
    .global-menu-btn:hover span { background: var(--ctp-text); }
    .menu-wrap:hover .global-menu-btn,
    .menu-wrap.just-added .global-menu-btn,
    .menu-wrap.open .global-menu-btn,
    .menu-wrap:focus-within .global-menu-btn {
      opacity: 1;
    }

    .global-menu {
      display: none;
      position: absolute;
      top: 42px;
      right: 0;
      background: var(--ctp-crust);
      border: 1px solid var(--ctp-surface1);
      border-radius: 8px;
      overflow: hidden;
      min-width: 190px;
      max-width: calc(100vw - 20px);
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.4);
    }
    .menu-wrap.open .global-menu { display: block; }
    .global-menu button {
      display: block;
      width: 100%;
      text-align: left;
      padding: 10px 14px;
      background: none;
      border: none;
      color: var(--ctp-subtext1);
      font-family: inherit;
      font-size: 14px;
      cursor: pointer;
    }
    .global-menu button:hover { background: var(--ctp-surface0); color: var(--ctp-text); }

    .global-menu-btn:focus-visible,
    .global-menu button:focus-visible,
    #offline-retry:focus-visible {
      outline: 2px solid var(--focus-ring);
      outline-offset: -2px;
    }

    .menu-separator {
      height: 1px;
      margin: 4px 0;
      background: var(--ctp-surface1);
    }

    .viewer-panel {
      display: none;
      max-height: 220px;
      overflow-y: auto;
      background: var(--ctp-mantle);
      border-top: 1px solid var(--ctp-surface1);
    }
    .viewer-panel.open { display: block; }
    .viewer-panel-item,
    .viewer-panel-empty {
      padding: 8px 14px;
      font-size: 13px;
      color: var(--ctp-subtext0);
    }
    .viewer-panel-empty { font-style: italic; color: var(--ctp-overlay1); }

    #offline {
      position: absolute;
      inset: 0;
      /* OvenPlayer's own internal panels (error message box, spinner,
         controls, etc.) use explicit z-index values up to 9 -- without one
         of our own, this being later in the DOM isn't enough to paint over
         them, so its "connection failed" message/icon showed through on top
         of ours. */
      z-index: 20;
      display: none;
      align-items: center;
      justify-content: center;
      color: white;
      font-size: 2em;
      background: black;
      background-size: cover;
      background-position: center;
      text-align: center;
      padding: 0 16px;
      /* This backdrop sits outside OvenPlayer's own wrapper element, so it
         being on top (needed for the z-index fix above) also swallowed the
         mouseenter/mousemove events OvenPlayer's own hover-to-show-controls
         logic needs -- and since that only ever arms on a genuine boundary
         crossing, not on a DOM/visibility change, controls stayed stuck
         hidden even after this overlay was hidden again. Letting pointer
         events pass through the empty backdrop (while keeping the message
         and retry button clickable via pointer-events: auto below) fixes
         that without giving up the visual coverage. */
      pointer-events: none;
    }
    #offline > div {
      pointer-events: auto;
    }
    #offline.has-image::before {
      content: "";
      position: absolute;
      inset: 0;
      background: rgba(0, 0, 0, 0.55);
    }
    #offline span {
      position: relative;
    }
    #offline-retry {
      position: relative;
      margin-top: 16px;
      width: 44px;
      height: 44px;
      padding: 0;
      color: white;
      background: rgba(255, 255, 255, 0.15);
      border: 1px solid rgba(255, 255, 255, 0.4);
      border-radius: 50%;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }
    #offline-retry:hover {
      background: rgba(255, 255, 255, 0.25);
    }
    #offline-retry svg {
      width: 22px;
      height: 22px;
    }

    @media (prefers-reduced-motion: reduce) {
      .global-menu-btn { transition: none; }
    }
  </style>
</head>
<body>
  <div class="layout" id="layout">
    <div class="video-pane">
      <div id="player"></div>
      <div id="offline">
        <div>
          <div><span>{{ streamname }} is offline</span></div>
          <button id="offline-retry" type="button" title="Try to connect anyway" aria-label="Try to connect anyway">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M20 11a8 8 0 1 0-2.34 5.66" />
              <polyline points="20 4 20 11 13 11" />
            </svg>
          </button>
        </div>
      </div>
    </div>
  </div>

  <div class="menu-wrap" id="menu-wrap" style="display:none;">
    <button class="global-menu-btn" id="global-menu-btn" type="button" title="Menu" aria-label="Menu">
      <span></span><span></span><span></span>
    </button>
    <div class="global-menu" id="global-menu">
      <button id="viewer-count-btn" type="button">Viewer count: &mdash;</button>
      <div class="viewer-panel" id="viewer-panel"></div>
    </div>
  </div>

  <script>
    const streamName = "{{ streamname }}";
    const host = "{{ OME_PUBLISHER_HOST }}";
    const port = "{{ OME_PUBLISHER_PORT }}"
    const appName = "{{ OME_APP_NAME }}";
    const streamTitle = "{{ streamtitle }}";
    const offlineImageUrl = {{ (offline_image_url or "") | tojson }};

    // Always attempt a connection immediately on page load, regardless of
    // what the SSE live-state feed below ends up saying -- this is what
    // gets the player initialized at all, and covers the case where a
    // user is already live before this page's SSE connection delivers
    // its first state. Beyond this first attempt, reconnects are driven by
    // that feed (see the "live" listener below) plus a slow backoff loop as
    // a fallback; the offline overlay itself is decided purely by the
    // player's own real connection events, never by the feed.
    const player = OvenPlayer.create("player", {
      sources: [{
        type: "webrtc",
        file: `wss://${host}:${port}/${appName}/${streamName}`,
      }],
      autoStart: true,
      playbackRates: [1],
      disableSeekUI: true,
      showBigPlayButton: true,
      expandFullScreenUI: true,
      title: `${streamTitle}`
    });

    const offlineMsg = document.getElementById("offline");

    if (offlineImageUrl) {
      offlineMsg.style.backgroundImage = `url("${offlineImageUrl.replace(/"/g, "%22")}")`;
      offlineMsg.classList.add("has-image");
    }

    let localRetryTimer = null;

    // Local reconnect loop is only a fallback for a missed/stale live signal
    // (e.g. a server restart resets the in-memory live state to "offline"
    // for a user who's actually still publishing, and no fresh webhook
    // event will arrive until they reconnect) -- normally the SSE "live"
    // push below does the reconnecting instantly. Since that fallback case
    // is rare, back off each failed attempt instead of hammering OME every
    // few seconds forever; reset to the base delay the moment we're told
    // the stream is live or actually see it play.
    const RECONNECT_BASE_MS = 5000;
    const RECONNECT_MAX_MS = 20 * 60 * 1000; // cap at 20 minutes between attempts
    const RECONNECT_MULTIPLIER = 1.6;
    let retryDelay = RECONNECT_BASE_MS;

    function setOffline() {
      offlineMsg.style.display = "flex";
      scheduleRetry();
    }
    function setOnline() {
      clearTimeout(localRetryTimer);
      retryDelay = RECONNECT_BASE_MS;
      offlineMsg.style.display = "none";
      document.getElementById('player').style.display = "block";
    }

    // Every player.load() spins up a brand-new native <video>/<audio> element
    // (unmuted, full volume by default) but OvenPlayer never re-applies its
    // own tracked mute/volume state onto it -- so a mute forced by the
    // autoplay fallback below, or a volume level the viewer dragged the
    // slider to, was silently dropped on the next reconnect: audio would
    // come back at full native volume while the slider kept showing whatever
    // it last displayed. Track the viewer's own explicit choices separately
    // from adjustments we make ourselves, and re-apply *those* at the start
    // of every load instead of leaving whatever a fresh element defaults to.
    //
    // Also persisted to localStorage keyed by stream name, so a volume set
    // while watching a stream directly on /live/<name> carries over when
    // that same stream shows up as a tile inside /multistream (a same-origin
    // iframe embed of this same page), and vice versa -- both are just
    // separate loads of this page for the same streamName.
    const volumeStorageKey = `rakuspace-volume-${streamName}`;
    let userMuted = false;
    let userVolume = null; // null until the viewer (or OvenPlayer's default) reports one
    try {
      const saved = JSON.parse(localStorage.getItem(volumeStorageKey));
      if (saved && typeof saved === "object") {
        if (typeof saved.muted === "boolean") userMuted = saved.muted;
        if (typeof saved.volume === "number") userVolume = saved.volume;
      }
    } catch (err) {
      // localStorage unavailable or bad data -- fall back to defaults.
    }
    function saveVolumePrefs() {
      try {
        localStorage.setItem(volumeStorageKey, JSON.stringify({ muted: userMuted, volume: userVolume }));
      } catch (err) {
        // ignore -- just won't persist across reloads/views
      }
    }
    let settingProgrammatically = false;
    function setMuteProgrammatic(muted) {
      settingProgrammatically = true;
      player.setMute(muted);
      settingProgrammatically = false;
    }
    function setVolumeProgrammatic(volume) {
      settingProgrammatically = true;
      player.setVolume(volume);
      settingProgrammatically = false;
    }
    player.on("mute", (e) => {
      if (!settingProgrammatically) {
        // Came from the viewer clicking the player's own mute button.
        userMuted = e.mute;
        saveVolumePrefs();
      }
    });
    player.on("volumeChanged", (e) => {
      if (!settingProgrammatically) {
        // Came from the viewer dragging the player's own volume slider.
        userVolume = e.volume;
        saveVolumePrefs();
      }
    });

    // Autoplay ladder: try playing with sound, and only fall back to muted
    // playback if the browser actually rejects the unmuted attempt. OvenPlayer's
    // own play()/getState() don't surface the underlying play() promise, so we
    // go straight to the real <video>/<audio> element (player.getMediaElement())
    // instead of probing autoplay policy with an unrelated decoy Audio() object,
    // which was unreliable and left streams muted (or stuck as "offline") far
    // more often than the browser's actual policy required.
    function attemptPlayback() {
      const media = player.getMediaElement();
      setMuteProgrammatic(userMuted);
      if (userVolume !== null) setVolumeProgrammatic(userVolume);
      if (!media) {
        player.play();
        return;
      }
      const attempt = media.play();
      if (!attempt || typeof attempt.catch !== "function") return;
      attempt.catch(() => {
        // Unmuted autoplay was rejected -- browsers are far more permissive
        // about muted autoplay, so retry once with sound off. This doesn't
        // touch userMuted -- it's a fallback we imposed, not the viewer's own
        // choice, so the next reconnect should still try unmuted first.
        if (!userMuted) setMuteProgrammatic(true);
        const mutedAttempt = media.play();
        if (mutedAttempt && typeof mutedAttempt.catch === "function") {
          // Even muted autoplay was rejected -- stop trying and leave the
          // player paused; the big-play-button lets the viewer start it.
          mutedAttempt.catch(() => {});
        }
      });
    }

    // Listen for events
    player.on("error", setOffline);
    player.on("ended", setOffline);
    player.on("stateChanged", (e) => {
      if (e.newstate === "playing") setOnline();
      if (e.newstate === "loading") attemptPlayback();
    });

    function connectSource() {
      player.load([{
        type: "webrtc",
        file: `wss://${host}:${port}/${appName}/${streamName}`
      }]);
    }

    // Fallback retry loop -- see the comment above retryDelay. Each failed
    // attempt waits longer than the last, up to RECONNECT_MAX_MS, instead of
    // polling OME on a fixed short interval indefinitely.
    function scheduleRetry() {
      clearTimeout(localRetryTimer);
      localRetryTimer = setTimeout(connectSource, retryDelay);
      retryDelay = Math.min(retryDelay * RECONNECT_MULTIPLIER, RECONNECT_MAX_MS);
    }

    // Manual escape hatch on the offline overlay: always attempts a
    // connection directly against OME, and resets the backoff since this is
    // effectively a fresh signal from the viewer that it's worth trying.
    document.getElementById("offline-retry").addEventListener("click", () => {
      clearTimeout(localRetryTimer);
      retryDelay = RECONNECT_BASE_MS;
      connectSource();
    });

    // OME's publish start/stop events (relayed via /auth/ome) drive
    // reconnects for the common case: when told the stream just went live
    // and we're not currently playing, jump the fallback retry queue and
    // reconnect right away, resetting the backoff since we now have a real
    // signal instead of a guess. An "offline" push is ignored -- it can
    // arrive spuriously (e.g. off an unrelated viewer connection closing)
    // and isn't needed anyway, since the fallback loop above already covers
    // "stop trying so aggressively once we're offline"; only the player's
    // own real connection events decide when to show the offline overlay.
    const liveEvents = new EventSource(`/api/live/${streamName}/events`);
    liveEvents.addEventListener("state", (e) => {
      if (e.data === "live" && player.getState() !== "playing") {
        clearTimeout(localRetryTimer);
        retryDelay = RECONNECT_BASE_MS;
        connectSource();
      }
    });

    // ---- Global menu (viewer count) ----
    //
    // Hidden entirely when this page is sitting inside an iframe -- e.g.
    // when this /live/<name> page is loaded as a tile inside /multistream,
    // its own viewers are split across whatever streams are tiled in, so a
    // single number wouldn't mean much there. window.top throws instead of
    // resolving to a different-origin ancestor for a strictly cross-origin
    // embed; either way that means "not the top-level page", so treat it
    // the same as being iframed.
    let inIframe = true;
    try {
      inIframe = window.self !== window.top;
    } catch (err) {
      inIframe = true;
    }

    if (!inIframe) {
      const menuWrap = document.getElementById("menu-wrap");
      const globalMenuBtn = document.getElementById("global-menu-btn");
      const viewerCountBtn = document.getElementById("viewer-count-btn");
      const viewerPanel = document.getElementById("viewer-panel");

      menuWrap.style.display = "";

      globalMenuBtn.addEventListener("click", (e) => {
        e.stopPropagation();
        menuWrap.classList.toggle("open");
      });
      document.addEventListener("click", (e) => {
        if (menuWrap.classList.contains("open") && !menuWrap.contains(e.target)) {
          menuWrap.classList.remove("open");
        }
      });

      // ---- Viewer count ----
      //
      // Fed by the "viewers" SSE event pushed over the same /api/live
      // connection already open for reconnect signalling below. The named
      // list is only ever present in that event for a viewer who's logged
      // in themselves -- for everyone else viewerNames stays null and the
      // panel explains why instead of silently showing nothing.
      let viewerCount = null;
      let viewerNames = null;

      function escapeHtml(s) {
        return s.replace(/[&<>"']/g, (c) => ({
          "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;",
        }[c]));
      }

      function renderViewerPanel() {
        if (viewerNames) {
          viewerPanel.innerHTML = viewerNames.length
            ? viewerNames.map((n) => `<div class="viewer-panel-item">${escapeHtml(n)}</div>`).join("")
            : `<div class="viewer-panel-empty">No logged-in viewers right now</div>`;
        } else {
          viewerPanel.innerHTML = `<div class="viewer-panel-empty">Log in to see who else is watching</div>`;
        }
      }

      function updateViewerUI() {
        viewerCountBtn.textContent = `Viewer count: ${viewerCount === null ? "—" : viewerCount}`;
        if (viewerPanel.classList.contains("open")) renderViewerPanel();
      }

      viewerCountBtn.addEventListener("click", (e) => {
        e.stopPropagation();
        viewerPanel.classList.toggle("open");
        if (viewerPanel.classList.contains("open")) renderViewerPanel();
      });

      liveEvents.addEventListener("viewers", (e) => {
        try {
          const data = JSON.parse(e.data);
          viewerCount = data.count;
          viewerNames = Array.isArray(data.viewers) ? data.viewers : null;
          updateViewerUI();
        } catch (err) {
          // malformed event -- ignore, keep showing the last good count
        }
      });

      menuWrap.classList.add("just-added");
      setTimeout(() => menuWrap.classList.remove("just-added"), 3000);
    }
  </script>
</body>
</html>
