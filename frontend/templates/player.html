<!DOCTYPE html>
<html>
<head>
  <title>Watching {{ streamname }}</title>
  <script src="{{ url_for('static', filename='ovenplayer/ovenplayer.js') }}"></script>
  <style>
    :root {
      /* Same video/chat width ratio knob as multistream.html. */
      --video-weight: 4;
    }
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
    }
    .layout {
      display: flex;
      width: 100vw;
      height: 100vh;
    }
    .video-pane {
      flex: var(--video-weight) 1 0;
      height: 100%;
      position: relative;
      overflow: hidden;
      min-width: 0;
    }
    #player {
      width: 100%;
      height: 100%;
    }

    /* --- chat pane (mirrors multistream.html) --- */

    .chat-pane {
      flex: 1 1 0;
      height: 100%;
      min-width: 0;
    }
    .chat-pane.hidden { display: none; }
    .chat-pane iframe {
      display: block;
      width: 100%;
      height: 100%;
      border: 0;
    }

    /* --- chat toggle burger (mirrors multistream.html, minus the dropdown) --- */

    .menu-wrap {
      position: fixed;
      top: 10px;
      right: 10px;
      z-index: 100;
    }
    .global-menu-btn {
      width: 36px;
      height: 36px;
      border: none;
      border-radius: 4px;
      background: rgba(0, 0, 0, 0.6);
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 4px;
      opacity: 0;
      transition: opacity 0.25s ease;
    }
    .global-menu-btn span {
      display: block;
      width: 18px;
      height: 2px;
      background: #fff;
    }
    .menu-wrap:hover .global-menu-btn,
    .menu-wrap.just-added .global-menu-btn {
      opacity: 1;
    }

    #offline {
      position: absolute;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      color: white;
      font-size: 2em;
      background: black;
      background-size: cover;
      background-position: center;
      text-align: center;
      padding: 0 16px;
    }
    #offline.has-image::before {
      content: "";
      position: absolute;
      inset: 0;
      background: rgba(0, 0, 0, 0.55);
    }
    #offline span {
      position: relative;
    }
    #offline-retry {
      position: relative;
      margin-top: 16px;
      width: 44px;
      height: 44px;
      padding: 0;
      color: white;
      background: rgba(255, 255, 255, 0.15);
      border: 1px solid rgba(255, 255, 255, 0.4);
      border-radius: 50%;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }
    #offline-retry:hover {
      background: rgba(255, 255, 255, 0.25);
    }
    #offline-retry svg {
      width: 22px;
      height: 22px;
    }
  </style>
</head>
<body>
  <div class="layout" id="layout">
    <div class="video-pane">
      <div id="player"></div>
      <div id="offline">
        <div>
          <div><span>{{ streamname }} is offline</span></div>
          <button id="offline-retry" type="button" title="Try to connect anyway" aria-label="Try to connect anyway">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M20 11a8 8 0 1 0-2.34 5.66" />
              <polyline points="20 4 20 11 13 11" />
            </svg>
          </button>
        </div>
      </div>
    </div>
    <div class="chat-pane hidden" id="chat-pane">
      <iframe id="chat-iframe" src="about:blank"></iframe>
    </div>
  </div>

  <div class="menu-wrap" id="menu-wrap" style="display:none;">
    <button class="global-menu-btn" id="chat-toggle-btn" title="Show/hide chat">
      <span></span><span></span><span></span>
    </button>
  </div>

  <script>
    const streamName = "{{ streamname }}";
    const host = "{{ OME_PUBLISHER_HOST }}";
    const port = "{{ OME_PUBLISHER_PORT }}"
    const appName = "{{ OME_APP_NAME }}";
    const streamTitle = "{{ streamtitle }}";
    const offlineImageUrl = {{ (offline_image_url or "") | tojson }};
    const chatUrl = {{ (chat_url or "") | tojson }};

    // No initial `sources` -- creating the player with a source and
    // autoStart would fire a connection attempt to OME immediately on page
    // load, before we've heard from the SSE live-state feed below. The
    // first (and every subsequent) load is instead driven off that feed;
    // autoStart is kept so each load() still attempts to play automatically
    // when the browser allows it.
    const player = OvenPlayer.create("player", {
      sources: [],
      autoStart: true,
      playbackRates: [1],
      disableSeekUI: true,
      showBigPlayButton: true,
      expandFullScreenUI: true,
      title: `${streamTitle}`
    });

    const offlineMsg = document.getElementById("offline");

    if (offlineImageUrl) {
      offlineMsg.style.backgroundImage = `url("${offlineImageUrl.replace(/"/g, "%22")}")`;
      offlineMsg.classList.add("has-image");
    }

    let liveState = null; // "live" | "offline", set by the /api/live SSE push below
    let localRetryTimer = null;

    function setOffline() {
      offlineMsg.style.display = "flex";
      // Only worth retrying on our own if OME still thinks the stream is up
      // (a transient viewer-side glitch); if OME says offline, there's
      // nothing to reconnect to until the push below says otherwise.
      if (liveState === "live") {
        retryStream();
      }
    }
    function setOnline() {
      clearTimeout(localRetryTimer);
      offlineMsg.style.display = "none";
      document.getElementById('player').style.display = "block";
    }

    // Autoplay ladder: try playing with sound, and only fall back to muted
    // playback if the browser actually rejects the unmuted attempt. OvenPlayer's
    // own play()/getState() don't surface the underlying play() promise, so we
    // go straight to the real <video>/<audio> element (player.getMediaElement())
    // instead of probing autoplay policy with an unrelated decoy Audio() object,
    // which was unreliable and left streams muted (or stuck as "offline") far
    // more often than the browser's actual policy required.
    function attemptPlayback() {
      const media = player.getMediaElement();
      if (!media) {
        player.play();
        return;
      }
      const attempt = media.play();
      if (!attempt || typeof attempt.catch !== "function") return;
      attempt.catch(() => {
        // Unmuted autoplay was rejected -- browsers are far more permissive
        // about muted autoplay, so retry once with sound off.
        player.setMute(true);
        const mutedAttempt = media.play();
        if (mutedAttempt && typeof mutedAttempt.catch === "function") {
          // Even muted autoplay was rejected -- stop trying and leave the
          // player paused; the big-play-button lets the viewer start it.
          mutedAttempt.catch(() => {});
        }
      });
    }

    // Listen for events
    player.on("error", setOffline);
    player.on("ended", setOffline);
    player.on("stateChanged", (e) => {
      if (e.newstate === "playing") setOnline();
    });

    // Retry logic -- only used for transient local errors while OME still
    // reports the stream as live; see setOffline() above.
    function retryStream() {
      clearTimeout(localRetryTimer);
      localRetryTimer = setTimeout(() => {
        player.load([{
          type: "webrtc",
          file: `wss://${host}:${port}/${appName}/${streamName}`
        }]);
        attemptPlayback();
      }, 3000);
    }

    // Manual escape hatch on the offline overlay itself: the overlay sits on
    // top of the player and blocks its big-play-button, and before the first
    // SSE "live" event ever arrives (e.g. right after a server restart, with
    // a streamer already live) there's no source loaded at all -- nothing
    // under the overlay to click. This always attempts a connection directly
    // against OME, independent of our tracked liveState, so the viewer can
    // recover even if that state is stale or wrong.
    document.getElementById("offline-retry").addEventListener("click", () => {
      clearTimeout(localRetryTimer);
      player.load([{
        type: "webrtc",
        file: `wss://${host}:${port}/${appName}/${streamName}`
      }]);
      attemptPlayback();
    });

    // Drive (re)connect attempts off OME's own publish start/stop events
    // (relayed via /auth/ome into this SSE feed) instead of blindly retrying
    // a dead connection: only load a fresh source when actually told the
    // stream is live, and stop the instant we're told it isn't.
    const liveEvents = new EventSource(`/api/live/${streamName}/events`);
    liveEvents.addEventListener("state", (e) => {
      const state = e.data;
      if (state === liveState) return;
      liveState = state;
      if (state === "live") {
        player.load([{
          type: "webrtc",
          file: `wss://${host}:${port}/${appName}/${streamName}`
        }]);
        attemptPlayback();
      } else {
        setOffline();
      }
    });

    // ---- IRC chat toggle ----
    //
    // Only offered when the streamer has a channel configured AND this page
    // isn't itself sitting inside an iframe -- e.g. when this /live/<name>
    // page is loaded as a tile inside /multistream, that page already has
    // its own chat pane, so showing a second nested chat here would just be
    // redundant/confusing. window.top throws instead of resolving to a
    // different-origin ancestor for a strictly cross-origin embed; either
    // way that means "not the top-level page", so treat it the same as
    // being iframed.
    let inIframe = true;
    try {
      inIframe = window.self !== window.top;
    } catch (err) {
      inIframe = true;
    }

    if (chatUrl && !inIframe) {
      const menuWrap = document.getElementById("menu-wrap");
      const chatPane = document.getElementById("chat-pane");
      const chatIframe = document.getElementById("chat-iframe");
      const chatToggleBtn = document.getElementById("chat-toggle-btn");
      const storageKey = `rakuspace-chat-visible-${streamName}`;

      let chatVisible = true; // shown by default when a channel is configured
      try {
        const saved = localStorage.getItem(storageKey);
        if (saved !== null) chatVisible = saved === "1";
      } catch (err) {
        // localStorage unavailable (private browsing etc.) -- fall back to the default.
      }

      let chatLoaded = false;
      function applyChatVisibility() {
        chatPane.classList.toggle("hidden", !chatVisible);
        if (chatVisible && !chatLoaded) {
          chatIframe.src = chatUrl;
          chatLoaded = true;
        } else if (!chatVisible && chatLoaded) {
          chatIframe.src = "about:blank";
          chatLoaded = false;
        }
      }

      menuWrap.style.display = "";
      applyChatVisibility();

      chatToggleBtn.addEventListener("click", () => {
        chatVisible = !chatVisible;
        applyChatVisibility();
        try {
          localStorage.setItem(storageKey, chatVisible ? "1" : "0");
        } catch (err) {
          // ignore -- just won't persist across reloads
        }
      });

      menuWrap.classList.add("just-added");
      setTimeout(() => menuWrap.classList.remove("just-added"), 3000);
    }
  </script>
</body>
</html>
