<!DOCTYPE html>
<html>
<head>
  <title>Watching {{ streamname }}</title>
  <script src="{{ url_for('static', filename='ovenplayer/ovenplayer.js') }}"></script>
  <style>
    #offline {
      position: absolute;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      color: white;
      font-size: 2em;
      background: black;
      background-size: cover;
      background-position: center;
      text-align: center;
      padding: 0 16px;
    }
    #offline.has-image::before {
      content: "";
      position: absolute;
      inset: 0;
      background: rgba(0, 0, 0, 0.55);
    }
    #offline span {
      position: relative;
    }
    #offline-retry {
      position: relative;
      margin-top: 16px;
      padding: 8px 20px;
      font-size: 0.5em;
      color: white;
      background: rgba(255, 255, 255, 0.15);
      border: 1px solid rgba(255, 255, 255, 0.4);
      border-radius: 4px;
      cursor: pointer;
    }
    #offline-retry:hover {
      background: rgba(255, 255, 255, 0.25);
    }
  </style>
</head>
<body style="margin:0; background:black; display:flex; align-items:center; justify-content:center; height:100vh;">
  <div id="player" style="width:100%; height:100%;"></div>
  <div id="offline">
    <div>
      <div><span>{{ streamname }} is offline</span></div>
      <button id="offline-retry" type="button">Try to connect anyway</button>
    </div>
  </div>

  <script>
    const streamName = "{{ streamname }}";
    const host = "{{ OME_PUBLISHER_HOST }}";
    const port = "{{ OME_PUBLISHER_PORT }}"
    const appName = "{{ OME_APP_NAME }}";
    const streamTitle = "{{ streamtitle }}";
    const offlineImageUrl = {{ (offline_image_url or "") | tojson }};

    // No initial `sources` -- creating the player with a source and
    // autoStart would fire a connection attempt to OME immediately on page
    // load, before we've heard from the SSE live-state feed below. The
    // first (and every subsequent) load is instead driven off that feed;
    // autoStart is kept so each load() still attempts to play automatically
    // when the browser allows it.
    const player = OvenPlayer.create("player", {
      sources: [],
      autoStart: true,
      playbackRates: [1],
      disableSeekUI: true,
      showBigPlayButton: true,
      expandFullScreenUI: true,
      title: `${streamTitle}`
    });

    const offlineMsg = document.getElementById("offline");

    if (offlineImageUrl) {
      offlineMsg.style.backgroundImage = `url("${offlineImageUrl.replace(/"/g, "%22")}")`;
      offlineMsg.classList.add("has-image");
    }

    let liveState = null; // "live" | "offline", set by the /api/live SSE push below
    let localRetryTimer = null;

    function setOffline() {
      offlineMsg.style.display = "flex";
      // Only worth retrying on our own if OME still thinks the stream is up
      // (a transient viewer-side glitch); if OME says offline, there's
      // nothing to reconnect to until the push below says otherwise.
      if (liveState === "live") {
        retryStream();
      }
    }
    function setOnline() {
      clearTimeout(localRetryTimer);
      offlineMsg.style.display = "none";
      document.getElementById('player').style.display = "block";
      player.play();
    }


    function checkAutoplay() {
        if(player.getState() != "playing") {
            //console.log("fooey")
            const audio = new Audio();
            audio.play().then(() => {
                return;
            }).catch(error => {
                // Autoplay was prevented (e.g., by browser policy)
                console.log("Autoplay prevented:", error.name);
                player.setMute(true);
                setOnline();
            });
        }
    }

    // Listen for events
    player.on("error", setOffline);
    player.on("ended", setOffline);
    player.on("stateChanged", (e) => {
      //console.log("nani");
      if(e.newstate === "playing") setOnline();
      if(e.newstate === "loading") checkAutoplay();
    });

    // Retry logic -- only used for transient local errors while OME still
    // reports the stream as live; see setOffline() above.
    function retryStream() {
      clearTimeout(localRetryTimer);
      localRetryTimer = setTimeout(() => {
        player.load([{
          type: "webrtc",
          file: `wss://${host}:${port}/${appName}/${streamName}`
        }]);
      }, 3000);
    }

    // Manual escape hatch on the offline overlay itself: the overlay sits on
    // top of the player and blocks its big-play-button, and before the first
    // SSE "live" event ever arrives (e.g. right after a server restart, with
    // a streamer already live) there's no source loaded at all -- nothing
    // under the overlay to click. This always attempts a connection directly
    // against OME, independent of our tracked liveState, so the viewer can
    // recover even if that state is stale or wrong.
    document.getElementById("offline-retry").addEventListener("click", () => {
      clearTimeout(localRetryTimer);
      player.load([{
        type: "webrtc",
        file: `wss://${host}:${port}/${appName}/${streamName}`
      }]);
      player.play();
    });

    // Drive (re)connect attempts off OME's own publish start/stop events
    // (relayed via /auth/ome into this SSE feed) instead of blindly retrying
    // a dead connection: only load a fresh source when actually told the
    // stream is live, and stop the instant we're told it isn't.
    const liveEvents = new EventSource(`/api/live/${streamName}/events`);
    liveEvents.addEventListener("state", (e) => {
      const state = e.data;
      if (state === liveState) return;
      liveState = state;
      if (state === "live") {
        player.load([{
          type: "webrtc",
          file: `wss://${host}:${port}/${appName}/${streamName}`
        }]);
        player.play();
      } else {
        setOffline();
      }
    });
  </script>
</body>
</html>
