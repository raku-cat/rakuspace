<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Multi-stream viewer - RakuSpace</title>
<style>
  :root {
    /* Adjust this one number to change the video-area/chat width ratio.
       It's the video-pane's flex-grow weight against the chat pane's
       weight of 1 — e.g. 3 means the video area is 3x as wide as chat,
       1 means an even split, 6 means a much narrower chat column. */
    --video-weight: 4;
  }

  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  }

  .layout {
    display: flex;
    width: 100vw;
    height: 100vh;
  }

  /* --- video multistream area --- */

  .video-pane {
    flex: var(--video-weight) 1 0;
    height: 100%;
    position: relative;
    overflow: hidden;
    min-width: 0;
  }

  #video-root {
    width: 100%;
    height: 100%;
  }

  .split-container {
    display: flex;
    width: 100%;
    height: 100%;
    min-width: 0;
    min-height: 0;
  }
  .split-row { flex-direction: row; }
  .split-column { flex-direction: column; }

  .tile {
    position: relative;
    overflow: hidden;
    background: #0b0b0b;
    min-width: 0;
    min-height: 0;
  }

  .tile iframe {
    display: block;
    width: 100%;
    height: 100%;
    border: 0;
  }
  .tile iframe.inert { pointer-events: none; }

  .tile-drag-overlay {
    position: absolute;
    inset: 0;
    z-index: 10;
    background: transparent;
  }

  .tile-close {
    position: absolute;
    top: 6px;
    left: 6px;
    z-index: 20;
    width: 26px;
    height: 26px;
    border: none;
    border-radius: 4px;
    background: rgba(0, 0, 0, 0.65);
    color: #fff;
    font-size: 16px;
    line-height: 1;
    cursor: pointer;
    opacity: 0;
    transition: opacity 0.25s ease;
  }
  .tile:hover .tile-close,
  .tile-close.just-added {
    opacity: 1;
  }
  .tile-close:hover { background: rgba(200, 40, 40, 0.85); }

  .tile-empty {
    width: 100%;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    background: repeating-linear-gradient(45deg, #141414, #141414 10px, #191919 10px, #191919 20px);
  }
  .plus-icon {
    width: 60px;
    height: 60px;
    border-radius: 50%;
    border: 2px dashed rgba(255, 255, 255, 0.4);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 30px;
    color: rgba(255, 255, 255, 0.6);
    transition: transform 0.15s ease, border-color 0.15s ease, color 0.15s ease;
  }
  .tile-empty:hover .plus-icon {
    transform: scale(1.08);
    border-color: rgba(255, 255, 255, 0.85);
    color: #fff;
  }

  .name-form {
    display: flex;
    gap: 8px;
    align-items: center;
    background: rgba(0, 0, 0, 0.55);
    padding: 14px;
    border-radius: 8px;
  }
  .name-form input {
    font-size: 14px;
    padding: 8px 10px;
    border-radius: 4px;
    border: 1px solid #494d64;
    background: #1e2030;
    color: #cad3f5;
    outline: none;
    width: 180px;
  }
  .name-form input:focus { border-color: #8aadf4; }
  .name-form button {
    font-size: 13px;
    padding: 8px 12px;
    border-radius: 4px;
    border: none;
    cursor: pointer;
    color: #cad3f5;
  }
  .name-form .load-btn { background: #40a02b; }
  .name-form .load-btn:hover { background: #4bb832; }
  .name-form .cancel-btn { background: #363a4f; }
  .name-form .cancel-btn:hover { background: #494d64; }

  .resizer {
    flex: 0 0 auto;
    background: rgba(255, 255, 255, 0.06);
    z-index: 15;
  }
  .resizer:hover { background: rgba(255, 255, 255, 0.25); }
  .resizer-row { width: 6px; cursor: col-resize; }
  .resizer-column { height: 6px; cursor: row-resize; }
  body.resizing { user-select: none; }

  .drop-indicator {
    position: absolute;
    background: rgba(100, 170, 255, 0.35);
    border: 2px solid rgba(100, 170, 255, 0.9);
    pointer-events: none;
    z-index: 50;
  }
  .drop-left   { left: 0; top: 0; width: 50%; height: 100%; }
  .drop-right  { right: 0; top: 0; width: 50%; height: 100%; }
  .drop-top    { left: 0; top: 0; width: 100%; height: 50%; }
  .drop-bottom { left: 0; bottom: 0; width: 100%; height: 50%; }
  .drop-center { left: 12%; top: 12%; width: 76%; height: 76%; }

  /* --- chat pane --- */

  .chat-pane {
    flex: 1 1 0;
    height: 100%;
    min-width: 0;
  }
  .chat-pane.hidden { display: none; }
  .chat-pane iframe {
    display: block;
    width: 100%;
    height: 100%;
    border: 0;
  }

  /* --- global menu --- */

  .menu-wrap {
    position: fixed;
    top: 10px;
    right: 10px;
    z-index: 100;
  }
  .global-menu-btn {
    width: 36px;
    height: 36px;
    border: none;
    border-radius: 4px;
    background: rgba(0, 0, 0, 0.6);
    cursor: pointer;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 4px;
    opacity: 0;
    transition: opacity 0.25s ease;
  }
  .global-menu-btn span {
    display: block;
    width: 18px;
    height: 2px;
    background: #fff;
  }
  .menu-wrap:hover .global-menu-btn,
  .menu-wrap.just-added .global-menu-btn,
  .menu-wrap.open .global-menu-btn {
    opacity: 1;
  }

  .global-menu {
    display: none;
    position: absolute;
    top: 42px;
    right: 0;
    background: rgba(20, 20, 20, 0.95);
    border-radius: 6px;
    overflow: hidden;
    min-width: 170px;
    box-shadow: 0 4px 16px rgba(0, 0, 0, 0.4);
  }
  .menu-wrap.open .global-menu { display: block; }
  .global-menu button {
    display: block;
    width: 100%;
    text-align: left;
    padding: 10px 14px;
    background: none;
    border: none;
    color: #fff;
    font-size: 14px;
    cursor: pointer;
  }
  .global-menu button:hover { background: rgba(255, 255, 255, 0.1); }
</style>
</head>
<body>
<div class="layout">
  <div class="video-pane">
    <div id="video-root"></div>
  </div>
  <div class="chat-pane" id="chat-pane">
    <!-- Chat embed intentionally left blank for now; reserved for future use. -->
    <iframe id="chat-iframe" src="about:blank"></iframe>
  </div>
</div>

<div class="menu-wrap" id="menu-wrap">
  <button class="global-menu-btn" id="global-menu-btn" title="Menu">
    <span></span><span></span><span></span>
  </button>
  <div class="global-menu" id="global-menu">
    <button id="menu-add-stream" type="button">Add stream</button>
    <button id="menu-toggle-chat" type="button">Hide chat</button>
    <button id="menu-toggle-edit" type="button">Edit layout</button>
    <button id="menu-reset-layout" type="button">Reset layout</button>
  </div>
</div>

<script>
(function () {
  // The base URL used to build each stream's iframe src: LIVE_BASE + name.
  const LIVE_BASE_URL = '/live/';

  let nextId = 1;
  function makeLeaf(size) {
    return { type: 'leaf', id: nextId++, name: null, editing: false, justAdded: false, size: size || 1 };
  }
  function makeSplit(direction, children, size) {
    return { type: 'split', id: nextId++, direction, children, size: size || 1 };
  }

  const state = {
    chatVisible: true,
    editMode: false,
    root: makeSplit('row', [makeLeaf(1)]),
  };

  let dragNode = null;
  let resizeState = null;

  // Persistent cache of leaf DOM elements keyed by node id, reused across
  // renders so that live-loaded stream iframes are never torn down and
  // recreated (which would reload the embedded player) just because the
  // tree got re-rendered for an unrelated reason like toggling edit mode.
  const leafCache = new Map();

  // ---- persistence ----

  const STORAGE_KEY = 'irc-embed-stream-layout-v1';

  function serializeNode(node) {
    if (node.type === 'leaf') {
      return { type: 'leaf', id: node.id, name: node.name, size: node.size };
    }
    return {
      type: 'split',
      id: node.id,
      direction: node.direction,
      size: node.size,
      children: node.children.map(serializeNode),
    };
  }

  function deserializeNode(data) {
    if (data.type === 'leaf') {
      return { type: 'leaf', id: data.id, name: data.name || null, editing: false, justAdded: false, size: data.size || 1 };
    }
    return {
      type: 'split',
      id: data.id,
      direction: data.direction === 'column' ? 'column' : 'row',
      size: data.size || 1,
      children: (data.children || []).map(deserializeNode),
    };
  }

  function maxId(node, acc) {
    acc = Math.max(acc, node.id || 0);
    if (node.type === 'split') {
      for (const c of node.children) acc = Math.max(acc, maxId(c, acc));
    }
    return acc;
  }

  function saveState() {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify({
        version: 1,
        chatVisible: state.chatVisible,
        root: serializeNode(state.root),
      }));
    } catch (err) {
      console.warn('[stream] failed to save layout to localStorage', err);
    }
  }

  function loadState() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (!raw) return;
      const data = JSON.parse(raw);
      if (!data || data.version !== 1 || !data.root) return;
      state.root = deserializeNode(data.root);
      state.chatVisible = data.chatVisible !== false;
      nextId = maxId(state.root, 0) + 1;
    } catch (err) {
      console.warn('[stream] failed to load saved layout, starting fresh', err);
    }
  }

  function resetLayout() {
    if (!confirm('Reset the stream layout? This removes all added streams.')) return;
    leafCache.clear();
    state.root = makeSplit('row', [makeLeaf(1)]);
    state.chatVisible = true;
    render();
  }

  // ---- tree helpers ----

  function findParent(container, target) {
    if (container.type !== 'split') return null;
    if (container.children.includes(target)) return container;
    for (const child of container.children) {
      const found = findParent(child, target);
      if (found) return found;
    }
    return null;
  }

  function collapseIfNeeded(container) {
    if (container === state.root) {
      if (container.children.length === 0) {
        container.children.push(makeLeaf(1));
      }
      return;
    }
    const parent = findParent(state.root, container);
    if (!parent) return;
    if (container.children.length === 0) {
      parent.children = parent.children.filter((c) => c !== container);
      collapseIfNeeded(parent);
    } else if (container.children.length === 1) {
      const only = container.children[0];
      only.size = container.size;
      const idx = parent.children.indexOf(container);
      parent.children[idx] = only;
      collapseIfNeeded(parent);
    }
  }

  function closeLeaf(node) {
    const parent = findParent(state.root, node);
    if (!parent) return;
    parent.children = parent.children.filter((c) => c !== node);
    collapseIfNeeded(parent);
    leafCache.delete(node.id);
    render();
  }

  function addStream() {
    state.root.children.forEach((c) => { c.size = 1; });
    state.root.children.push(makeLeaf(1));
    render();
  }

  function equalizeSiblings(container) {
    container.children.forEach((c) => { c.size = 1; });
  }

  function performDrop(source, target, zone) {
    const sourceParent = findParent(state.root, source);
    if (!sourceParent) return;

    sourceParent.children = sourceParent.children.filter((c) => c !== source);
    collapseIfNeeded(sourceParent);

    const targetParent = findParent(state.root, target);
    if (!targetParent) return;

    if (zone === 'center') {
      const idx = targetParent.children.indexOf(target);
      targetParent.children.splice(idx + 1, 0, source);
      equalizeSiblings(targetParent);
      return;
    }

    const axis = (zone === 'left' || zone === 'right') ? 'row' : 'column';
    const before = (zone === 'left' || zone === 'top');

    if (targetParent.direction === axis) {
      // Inserting into a container that already splits on this axis:
      // re-equalize all siblings rather than repeatedly halving just the
      // target's share, which otherwise compounds into vanishingly thin
      // panes after a few drags.
      const idx = targetParent.children.indexOf(target);
      targetParent.children.splice(before ? idx : idx + 1, 0, source);
      equalizeSiblings(targetParent);
    } else {
      // Perpendicular split: wrap target in a new split container that
      // takes over target's old share, and give the two new children
      // (source and target) an even split within it.
      const newSplit = makeSplit(axis, before ? [source, target] : [target, source], target.size);
      source.size = 1;
      target.size = 1;
      const idx = targetParent.children.indexOf(target);
      targetParent.children[idx] = newSplit;
    }
  }

  // ---- drag to split / reorder ----

  function computeDropZone(x, y) {
    const EDGE = 0.25;
    if (x < EDGE) return 'left';
    if (x > 1 - EDGE) return 'right';
    if (y < EDGE) return 'top';
    if (y > 1 - EDGE) return 'bottom';
    return 'center';
  }

  function clearDropIndicators() {
    document.querySelectorAll('.drop-indicator').forEach((el) => el.remove());
  }

  function showDropIndicator(el, zone) {
    clearDropIndicators();
    const ind = document.createElement('div');
    ind.className = 'drop-indicator drop-' + zone;
    el.appendChild(ind);
  }

  function onDragStart(node, e) {
    dragNode = node;
    e.dataTransfer.effectAllowed = 'move';
    e.dataTransfer.setData('text/plain', String(node.id));
  }

  function onDragOver(node, el, e) {
    if (!dragNode || dragNode === node) return;
    e.preventDefault();
    e.dataTransfer.dropEffect = 'move';
    const rect = el.getBoundingClientRect();
    const x = (e.clientX - rect.left) / rect.width;
    const y = (e.clientY - rect.top) / rect.height;
    showDropIndicator(el, computeDropZone(x, y));
  }

  function onDragLeave(el, e) {
    if (!el.contains(e.relatedTarget)) clearDropIndicators();
  }

  function onDrop(node, el, e) {
    e.preventDefault();
    clearDropIndicators();
    if (!dragNode || dragNode === node) { dragNode = null; return; }
    const rect = el.getBoundingClientRect();
    const x = (e.clientX - rect.left) / rect.width;
    const y = (e.clientY - rect.top) / rect.height;
    performDrop(dragNode, node, computeDropZone(x, y));
    dragNode = null;
    render();
  }

  document.addEventListener('dragend', () => {
    dragNode = null;
    clearDropIndicators();
  });

  // ---- resize ----

  function startResize(parent, i, aEl, bEl, e) {
    e.preventDefault();
    const a = parent.children[i];
    const b = parent.children[i + 1];
    const isRow = parent.direction === 'row';
    const aRect = aEl.getBoundingClientRect();
    const bRect = bEl.getBoundingClientRect();
    const totalPx = isRow ? aRect.width + bRect.width : aRect.height + bRect.height;
    resizeState = {
      a, b, aEl, bEl, isRow,
      startPos: isRow ? e.clientX : e.clientY,
      aStartPx: isRow ? aRect.width : aRect.height,
      totalPx,
      totalSize: a.size + b.size,
    };
    document.body.classList.add('resizing');
  }

  document.addEventListener('mousemove', (e) => {
    if (!resizeState) return;
    const { isRow, startPos, aStartPx, totalPx, totalSize, a, b, aEl, bEl } = resizeState;
    const pos = isRow ? e.clientX : e.clientY;
    const delta = pos - startPos;
    const MIN_PX = 60;
    const newAPx = Math.min(Math.max(aStartPx + delta, MIN_PX), Math.max(totalPx - MIN_PX, MIN_PX));
    const ratio = newAPx / totalPx;
    a.size = totalSize * ratio;
    b.size = totalSize * (1 - ratio);
    aEl.style.flex = a.size + ' 1 0';
    bEl.style.flex = b.size + ' 1 0';
  });

  document.addEventListener('mouseup', () => {
    if (!resizeState) return;
    resizeState = null;
    document.body.classList.remove('resizing');
    saveState();
  });

  // ---- rendering ----

  function render() {
    const root = document.getElementById('video-root');
    root.innerHTML = '';
    root.appendChild(renderNode(state.root));

    document.body.classList.toggle('edit-mode', state.editMode);
    document.getElementById('chat-pane').classList.toggle('hidden', !state.chatVisible);
    document.getElementById('menu-toggle-chat').textContent = state.chatVisible ? 'Hide chat' : 'Show chat';
    document.getElementById('menu-toggle-edit').textContent = state.editMode ? 'Exit edit mode' : 'Edit layout';

    saveState();
  }

  function renderNode(node) {
    return node.type === 'leaf' ? renderLeaf(node) : renderSplit(node);
  }

  function renderSplit(node) {
    const el = document.createElement('div');
    el.className = 'split-container split-' + node.direction;
    el.style.flex = node.size + ' 1 0';

    const childEls = node.children.map(renderNode);
    childEls.forEach((childEl, i) => {
      el.appendChild(childEl);
      if (state.editMode && i < node.children.length - 1) {
        const bar = document.createElement('div');
        bar.className = 'resizer resizer-' + node.direction;
        bar.addEventListener('mousedown', (e) => startResize(node, i, childEl, childEls[i + 1], e));
        el.appendChild(bar);
      }
    });
    return el;
  }

  // Loaded stream tiles keep a single persistent DOM subtree (including the
  // iframe) in leafCache, reused across renders via appendChild -- moving an
  // already-attached iframe element doesn't reload it, only assigning a new
  // .src does. This is what stops edit-mode toggles / drag-drop / resize
  // re-renders from reloading every visible stream.
  function computeStreamSrc(name) {
    return LIVE_BASE_URL + encodeURIComponent(name);
  }

  function createStreamLeaf(node) {
    const el = document.createElement('div');
    el.className = 'tile';
    el.dataset.tileId = node.id;
    el.addEventListener('dragstart', (e) => onDragStart(node, e));
    el.addEventListener('dragover', (e) => onDragOver(node, el, e));
    el.addEventListener('dragleave', (e) => onDragLeave(el, e));
    el.addEventListener('drop', (e) => onDrop(node, el, e));

    const iframe = document.createElement('iframe');
    iframe.allow = 'autoplay; encrypted-media; picture-in-picture; fullscreen';
    iframe.allowFullscreen = true;
    el.appendChild(iframe);

    const overlay = document.createElement('div');
    overlay.className = 'tile-drag-overlay';

    const closeBtn = document.createElement('button');
    closeBtn.type = 'button';
    closeBtn.className = 'tile-close';
    closeBtn.textContent = '×';
    closeBtn.title = 'Close';
    closeBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      closeLeaf(node);
    });
    el.appendChild(closeBtn);

    return { el, iframe, overlay, closeBtn, src: null };
  }

  function updateStreamLeaf(entry, node) {
    const { el, iframe, overlay, closeBtn } = entry;
    el.style.flex = node.size + ' 1 0';
    el.draggable = state.editMode;

    const targetSrc = computeStreamSrc(node.name);
    if (entry.src !== targetSrc) {
      iframe.src = targetSrc;
      entry.src = targetSrc;
    }
    iframe.classList.toggle('inert', state.editMode);

    if (state.editMode) {
      if (!overlay.isConnected) el.insertBefore(overlay, closeBtn);
    } else if (overlay.isConnected) {
      overlay.remove();
    }

    closeBtn.classList.toggle('just-added', !!node.justAdded);
  }

  function renderLeaf(node) {
    if (node.name) {
      let entry = leafCache.get(node.id);
      if (!entry) {
        entry = createStreamLeaf(node);
        leafCache.set(node.id, entry);
      }
      updateStreamLeaf(entry, node);
      return entry.el;
    }

    leafCache.delete(node.id);

    const el = document.createElement('div');
    el.className = 'tile';
    el.dataset.tileId = node.id;
    el.style.flex = node.size + ' 1 0';
    el.draggable = state.editMode && !node.editing;
    el.addEventListener('dragstart', (e) => onDragStart(node, e));
    el.addEventListener('dragover', (e) => onDragOver(node, el, e));
    el.addEventListener('dragleave', (e) => onDragLeave(el, e));
    el.addEventListener('drop', (e) => onDrop(node, el, e));

    const empty = document.createElement('div');
    empty.className = 'tile-empty';
    if (node.editing) {
      empty.appendChild(renderNameForm(node));
    } else {
      const plus = document.createElement('div');
      plus.className = 'plus-icon';
      plus.textContent = '+';
      empty.appendChild(plus);
      empty.addEventListener('click', () => {
        node.editing = true;
        render();
      });
    }
    el.appendChild(empty);

    return el;
  }

  function renderNameForm(node) {
    const form = document.createElement('form');
    form.className = 'name-form';

    const input = document.createElement('input');
    input.type = 'text';
    input.placeholder = 'Stream name';
    input.autocomplete = 'off';
    form.appendChild(input);

    const loadBtn = document.createElement('button');
    loadBtn.type = 'submit';
    loadBtn.className = 'load-btn';
    loadBtn.textContent = 'Load';
    form.appendChild(loadBtn);

    const cancelBtn = document.createElement('button');
    cancelBtn.type = 'button';
    cancelBtn.className = 'cancel-btn';
    cancelBtn.textContent = 'Cancel';
    cancelBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      node.editing = false;
      render();
    });
    form.appendChild(cancelBtn);

    form.addEventListener('click', (e) => e.stopPropagation());
    form.addEventListener('submit', (e) => {
      e.preventDefault();
      const val = input.value.trim();
      if (!val) return;
      node.name = val;
      node.editing = false;
      node.justAdded = true;
      render();
      scheduleFade(node);
    });
    input.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') {
        node.editing = false;
        render();
      }
    });

    setTimeout(() => input.focus(), 0);
    return form;
  }

  function scheduleFade(node) {
    setTimeout(() => {
      node.justAdded = false;
      const el = document.querySelector('.tile[data-tile-id="' + node.id + '"] .tile-close');
      if (el) el.classList.remove('just-added');
    }, 2500);
  }

  // ---- global menu ----

  const menuWrap = document.getElementById('menu-wrap');
  document.getElementById('global-menu-btn').addEventListener('click', (e) => {
    e.stopPropagation();
    menuWrap.classList.toggle('open');
  });
  document.addEventListener('click', (e) => {
    if (menuWrap.classList.contains('open') && !menuWrap.contains(e.target)) {
      menuWrap.classList.remove('open');
    }
  });
  document.getElementById('menu-add-stream').addEventListener('click', () => {
    addStream();
    menuWrap.classList.remove('open');
  });
  document.getElementById('menu-toggle-chat').addEventListener('click', () => {
    state.chatVisible = !state.chatVisible;
    render();
    menuWrap.classList.remove('open');
  });
  document.getElementById('menu-toggle-edit').addEventListener('click', () => {
    state.editMode = !state.editMode;
    render();
    menuWrap.classList.remove('open');
  });
  document.getElementById('menu-reset-layout').addEventListener('click', () => {
    resetLayout();
    menuWrap.classList.remove('open');
  });

  menuWrap.classList.add('just-added');
  setTimeout(() => menuWrap.classList.remove('just-added'), 3000);

  loadState();
  render();
})();
</script>
</body>
</html>
