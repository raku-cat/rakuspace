<!DOCTYPE html>
<html>
<head>
  <title>RakuSpace</title>
  <link rel="icon" href="{{ url_for('static', filename='logo.png') }}">
  <link rel="manifest" href="{{ url_for('static', filename='manifest.webmanifest') }}">
  <script src="{{ url_for('static', filename='pwa.js') }}" defer></script>
  <link rel="stylesheet" href="{{ url_for('static', filename='app.css') }}">
  <style>
    body { display: flex; flex-direction: column; }

    main { flex: 1; display: flex; align-items: center; justify-content: center; width: 100%; max-width: none; box-sizing: border-box; padding: 0 16px 10vh; }

    .launch { width: 100%; max-width: 520px; }

    #stream-form { display: flex; align-items: center; gap: 10px; }
    .input-wrap { position: relative; flex: 1; min-width: 0; }
    #stream-input {
      height: 52px;
      padding: 0 46px 0 22px;
      font-size: 1.15em;
      border-radius: 26px;
      transition: border-color 0.15s;
    }
    .input-wrap.known #stream-input { border-color: var(--ctp-green); }
    .input-wrap.unknown #stream-input { border-color: var(--ctp-red); }
    #stream-hint {
      position: absolute;
      right: 20px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 1em;
      pointer-events: none;
    }
    .input-wrap.known #stream-hint { color: var(--ctp-green); }
    .input-wrap.unknown #stream-hint { color: var(--ctp-red); }

    #watch-btn {
      flex-shrink: 0;
      width: 52px;
      height: 52px;
      padding: 0;
      border-radius: 50%;
      display: grid;
      place-items: center;
    }
    #watch-btn svg { width: 18px; height: 18px; margin-left: 3px; fill: currentColor; }

    /* Recently viewed */
    #recent {
      display: flex;
      flex-wrap: wrap;
      align-items: baseline;
      justify-content: center;
      gap: 4px 10px;
      margin-top: 18px;
      font-size: 0.9em;
    }
    #recent .recent-label { color: var(--ctp-subtext0); }
    #recent-list { display: contents; list-style: none; }
    #recent-list li:not(:last-child)::after { content: "\00b7"; color: var(--ctp-overlay1); margin-left: 10px; }
    #recent-list a { color: var(--ctp-pink); text-decoration: none; }
    #recent-list a:hover { text-decoration: underline; }
    #clear-btn {
      font-size: 0.85em;
      color: var(--ctp-subtext0);
      background: none;
      border: none;
      cursor: pointer;
      padding: 0;
      margin-left: 4px;
    }
    #clear-btn:hover { color: var(--ctp-text); text-decoration: underline; background: none; }

    @media (prefers-reduced-motion: reduce) {
      #stream-input { transition: none; }
    }
  </style>
</head>
<body>

  <header>
    <div class="header-left">
      <a class="brand" href="{{ url_for('index') }}">
        <img src="{{ url_for('static', filename='logo.png') }}" alt="">
        <span class="brand-name">RakuSpace</span>
      </a>
    </div>
    <div class="header-links">
      <a class="golive-link" href="/go_live">Go Live!<span class="new-badge">New!</span></a>
      <a class="multistream-link" href="{{ lite_prefix }}/multistream">Multi-stream viewer<span class="new-badge">New!</span></a>
      <a class="login-btn" href="{{ url_for('stream_page') }}">User Settings</a>
    </div>
  </header>

  <main>
    <div class="launch">
      <form id="stream-form">
        <div class="input-wrap" id="input-wrap">
          <input id="stream-input" type="text" placeholder="Username" title="Enter a Username" aria-label="Username" autocomplete="off">
          <span id="stream-hint" aria-live="polite"></span>
        </div>
        <button type="submit" id="watch-btn" title="Watch" aria-label="Watch">
          <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3 1.5v13l11-6.5z"/></svg>
        </button>
      </form>

      <div id="recent" style="display:none">
        <span class="recent-label">Recently Viewed</span>
        <ul id="recent-list"></ul>
        <button type="button" id="clear-btn">clear</button>
      </div>
    </div>
  </main>

  <script>
    const LIVE_PREFIX = "{{ lite_prefix }}";
    const input = document.getElementById("stream-input");
    const hint = document.getElementById("stream-hint");
    const wrap = document.getElementById("input-wrap");
    const recentDiv = document.getElementById("recent");
    const recentList = document.getElementById("recent-list");

    // Usernames are case insensitive and always lowercase server side,
    // so normalize anything typed before using it.
    function normalizeName(raw) {
      return raw.trim().toLowerCase();
    }
    // Resolves true/false for a known/unknown user, null if the check failed.
    async function checkStream(name) {
      try {
        const res = await fetch("/api/check/" + encodeURIComponent(name));
        return (await res.json()).known;
      } catch { return null; }
    }

    // --- Recently viewed (localStorage) ---
    function getRecent() {
      try {
        // Lowercase and dedupe, which also cleans up older lists that logged
        // "raku" and "Raku" separately.
        const list = JSON.parse(localStorage.getItem("recentStreams") || "[]").map(n => n.toLowerCase());
        return [...new Set(list)];
      }
      catch { return []; }
    }
    function saveRecent(name) {
      let list = getRecent().filter(n => n !== name);
      list.unshift(name);
      list = list.slice(0, 5);
      localStorage.setItem("recentStreams", JSON.stringify(list));
    }
    function renderRecent() {
      const list = getRecent();
      if (list.length === 0) { recentDiv.style.display = "none"; return; }
      recentDiv.style.display = "";
      recentList.replaceChildren(...list.map(n => {
        const li = document.createElement("li");
        const a = document.createElement("a");
        a.href = LIVE_PREFIX + "/live/" + encodeURIComponent(n);
        a.textContent = n;
        li.appendChild(a);
        return li;
      }));
    }
    renderRecent();

    document.getElementById("clear-btn").addEventListener("click", function() {
      localStorage.removeItem("recentStreams");
      renderRecent();
    });

    // --- Username validation ---
    let debounceTimer;
    input.addEventListener("input", function() {
      const name = normalizeName(input.value);
      clearTimeout(debounceTimer);
      hint.textContent = "";
      hint.removeAttribute("title");
      wrap.className = "input-wrap";
      if (!name) return;
      debounceTimer = setTimeout(async () => {
        const known = await checkStream(name);
        if (known === null) return;
        hint.textContent = known ? "✓" : "✗";
        hint.title = known ? "Known user" : "Unknown user";
        hint.setAttribute("aria-label", hint.title);
        wrap.className = "input-wrap " + (known ? "known" : "unknown");
      }, 400);
    });

    // --- Form submit ---
    document.getElementById("stream-form").addEventListener("submit", async function(e) {
      e.preventDefault();
      const name = normalizeName(input.value);
      if (!name) return;
      // Only known users make it into recently viewed.
      if (await checkStream(name)) saveRecent(name);
      window.location.href = LIVE_PREFIX + "/live/" + encodeURIComponent(name);
    });
  </script>
</body>
</html>
