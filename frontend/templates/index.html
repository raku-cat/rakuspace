<!DOCTYPE html>
<html>
<head>
  <title>RakuSpace</title>
  <link rel="icon" href="{{ url_for('static', filename='logo.png') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='app.css') }}">
  <style>
    body { display: flex; flex-direction: column; }

    main { flex: 1; display: flex; align-items: center; justify-content: center; padding: 0; }

    .card { width: 340px; padding: 28px 32px; margin-bottom: 0; }
    .card h1 { margin: 0 0 18px 0; font-size: 1.1em; font-weight: 600; }

    #stream-form { display: flex; gap: 6px; }
    #stream-input { flex: 1; }

    /* Recent */
    #recent {
      margin-top: 20px;
      padding-top: 16px;
      border-top: 1px solid var(--ctp-surface1);
    }
    .recent-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 8px;
    }
    .recent-header b { font-size: 0.85em; color: var(--ctp-subtext0); }
    #clear-btn {
      font-size: 0.75em;
      color: var(--ctp-overlay1);
      background: none;
      border: none;
      cursor: pointer;
      padding: 0;
    }
    #clear-btn:hover { color: var(--ctp-subtext0); }

    #recent-list {
      margin: 0;
      padding-left: 1.1em;
      list-style: disc;
    }
    #recent-list li { margin: 3px 0; font-size: 0.9em; }
    #recent-list a { color: var(--ctp-pink); text-decoration: none; }
    #recent-list a:hover { text-decoration: underline; }
  </style>
</head>
<body>

  <header>
    <div class="header-left">
      <a class="brand" href="{{ url_for('index') }}">
        <img src="{{ url_for('static', filename='logo.png') }}" alt="">
        <span class="brand-name">RakuSpace</span>
      </a>
    </div>
    <div class="header-links">
      <a class="golive-link" href="/go_live">Go Live!<span class="new-badge">New!</span></a>
      <a class="multistream-link" href="{{ lite_prefix }}/multistream">Multi-stream viewer<span class="new-badge">New!</span></a>
      <a class="login-btn" href="/stream_info">Streamer Settings</a>
    </div>
  </header>

  <main>
    <div class="card">
      <h1>Watch a stream</h1>

      <form id="stream-form">
        <input id="stream-input" type="text" placeholder="stream name" autocomplete="off">
        <button type="submit">Watch</button>
      </form>
      <div id="stream-hint"></div>

      <div id="recent" style="display:none">
        <div class="recent-header">
          <b>Recent Streams</b>
          <button id="clear-btn">clear</button>
        </div>
        <ul id="recent-list"></ul>
      </div>
    </div>
  </main>

  <script>
    const LIVE_PREFIX = "{{ lite_prefix }}";
    const input = document.getElementById("stream-input");
    const hint = document.getElementById("stream-hint");
    const recentDiv = document.getElementById("recent");
    const recentList = document.getElementById("recent-list");

    // --- Recent streams (localStorage) ---
    function getRecent() {
      try { return JSON.parse(localStorage.getItem("recentStreams") || "[]"); }
      catch { return []; }
    }
    function saveRecent(name) {
      let list = getRecent().filter(n => n !== name);
      list.unshift(name);
      list = list.slice(0, 5);
      localStorage.setItem("recentStreams", JSON.stringify(list));
    }
    function renderRecent() {
      const list = getRecent();
      if (list.length === 0) { recentDiv.style.display = "none"; return; }
      recentDiv.style.display = "";
      recentList.replaceChildren(...list.map(n => {
        const li = document.createElement("li");
        const a = document.createElement("a");
        a.href = LIVE_PREFIX + "/live/" + encodeURIComponent(n);
        a.textContent = n;
        li.appendChild(a);
        return li;
      }));
    }
    renderRecent();

    document.getElementById("clear-btn").addEventListener("click", function() {
      localStorage.removeItem("recentStreams");
      renderRecent();
    });

    // --- Stream name validation ---
    let debounceTimer;
    input.addEventListener("input", function() {
      const name = input.value.trim();
      clearTimeout(debounceTimer);
      hint.textContent = "";
      hint.className = "";
      if (!name) return;
      debounceTimer = setTimeout(async () => {
        try {
          const res = await fetch("/api/check/" + encodeURIComponent(name));
          const data = await res.json();
          if (data.known) {
            hint.textContent = "✓ known streamer";
            hint.className = "known";
          } else {
            hint.textContent = "✗ unknown stream name";
            hint.className = "unknown";
          }
        } catch { hint.textContent = ""; }
      }, 400);
    });

    // --- Form submit ---
    document.getElementById("stream-form").addEventListener("submit", function(e) {
      e.preventDefault();
      const name = input.value.trim();
      if (name) {
        saveRecent(name);
        window.location.href = LIVE_PREFIX + "/live/" + encodeURIComponent(name);
      }
    });
  </script>
</body>
</html>
